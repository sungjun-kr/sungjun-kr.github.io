<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게스트 성과 대시보드</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page-plane: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --gridline: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --critical: #d03b3b;
  --good: #0ca30c;
  --warning: #a06600;
  --perf-blue: #1f6fd0;
  --perf-green: #0a8f0a;
  --perf-yellow: #a06600;
  --perf-red: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page-plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --gridline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --critical: #e66767;
    --good: #24c724;
    --warning: #fab219;
    --perf-blue: #5aa9ff;
    --perf-green: #3ddc3d;
    --perf-yellow: #fab219;
    --perf-red: #ff7b7b;
  }
}
* { box-sizing: border-box; }
/* hidden 속성이 display:flex 같은 규칙에 밀리지 않도록 확실히 숨겨요. */
[hidden] { display: none !important; }
/* 게시 결과 알림 */
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  z-index: 9999; max-width: 90vw; padding: 14px 22px; border-radius: 10px;
  font-size: 14px; font-weight: 700; color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.28);
}
#toast.ok { background: var(--good); }
#toast.bad { background: var(--critical); }
body { margin: 0; background: var(--page-plane); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.page { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.topbar h1 { font-size: 20px; font-weight: 600; margin: 0; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.center-card { max-width: 420px; margin: 80px auto; text-align: center; }
.center-card p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
input[type="password"], input[type="text"] {
  width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary);
  margin-bottom: 10px; font-family: inherit;
}
.btn-primary, .btn-secondary, .btn-ghost {
  font-family: inherit; font-size: 14px; font-weight: 600;
  border-radius: 8px; cursor: pointer; padding: 10px 18px; border: 1px solid transparent;
}
.btn-primary { background: var(--series-1); color: #fff; width: 100%; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border); padding: 8px 14px; }
.btn-ghost { background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; padding: 6px; text-decoration: underline; }
.fine-print { font-size: 12px; color: var(--muted); line-height: 1.6; }
.error-text { font-size: 13px; color: var(--critical); margin-top: 10px; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.muted-text { color: var(--muted); font-size: 13px; margin-right: auto; }
.month-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.scope-tabs { margin-bottom: 12px; }
.scope-tabs .month-tab { font-size: 14px; padding: 9px 20px; }
.scope-tabs { align-items: center; }
.month-tab.tab-right {
  margin-left: auto; font-size: 12px; padding: 6px 14px;
  border-color: var(--good); color: var(--good); font-weight: 700;
}
.month-tab.tab-right:hover { background: rgba(12,163,12,0.10); }
.month-tab.tab-right.active { background: var(--good); border-color: var(--good); color: #fff; }
.topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.topic-col h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
.topic-item { border-top: 1px solid var(--gridline); padding: 8px 0; }
.topic-item:first-of-type { border-top: none; }
.topic-title { font-size: 12px; line-height: 1.45; color: var(--text-primary); }
.topic-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sub-tabs { margin-bottom: 12px; }
.sub-tabs .month-tab { font-size: 12px; padding: 6px 13px; }
.month-tab {
  padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer;
}
.month-tab.active { background: var(--series-1); color: #fff; border-color: var(--series-1); }
.guest-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; }
.guest-card h3 { margin: 0 0 4px; font-size: 16px; }
.guest-date { color: var(--muted); font-size: 12px; }

.guest-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; background: none; border: none; padding: 0 0 12px; margin: 0;
  font-family: inherit; text-align: left; cursor: pointer; color: inherit;
}
.guest-toggle.no-detail { cursor: default; }
.guest-toggle-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.guest-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.guest-toggle:hover:not(.no-detail) .guest-name { color: var(--series-1); }
.chevron { color: var(--muted); font-size: 13px; flex-shrink: 0; transition: transform 0.15s; }
.guest-card.open .chevron { transform: rotate(180deg); }
.detail-panel { margin-top: 14px; padding-top: 4px; border-top: 1px solid var(--gridline); }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-tile { background: var(--page-plane); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.stat-value { font-size: 20px; font-weight: 600; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* 당월 평균 대비 성과 색상 */
.perf-high { color: var(--perf-blue); }
.perf-good { color: var(--perf-green); }
.perf-warn { color: var(--perf-yellow); }
.perf-bad  { color: var(--perf-red); }

/* 총 조회수 절대 등급 배지 */
.grade {
  display: inline-block; margin-left: 8px; padding: 1px 8px;
  border-radius: 5px; font-size: 12px; font-weight: 700; line-height: 1.5;
  vertical-align: 2px; letter-spacing: 0.3px; color: #fff;
}
.grade-S { background: #7b3fe4; }
.grade-A { background: #1f6fd0; }
.grade-B { background: #0a8f0a; }
.grade-C { background: #a06600; }
.grade-D { background: #8a8a85; }

/* 전월 대비 등급 변화 */
.grade-chg { margin-left: 6px; font-size: 11px; font-weight: 700; vertical-align: 2px; }
.chg-up   { color: var(--perf-green); }
.chg-down { color: var(--perf-red); }
.chg-same { color: var(--muted); }
/* 총 조회수 타일의 '직전 대비' 줄 — stat-sub 기본 회색보다 색을 우선해요. */
.stat-sub.chg-up   { color: var(--perf-green); font-weight: 600; }
.stat-sub.chg-down { color: var(--perf-red); font-weight: 600; }
.stat-sub.chg-same { color: var(--muted); }

.legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -8px 0 18px; }
.legend .lg { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.legend .lg.perf-high { color: var(--perf-blue); }
.legend .lg.perf-good { color: var(--perf-green); }
.legend .lg.perf-warn { color: var(--perf-yellow); }
.legend .lg.perf-bad  { color: var(--perf-red); }
.video-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.video-table th, .video-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--gridline); }
.video-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.video-table td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.btn-block {
  font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
  border-radius: 6px; padding: 3px 8px; white-space: nowrap;
  border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
}
.btn-block:hover { border-color: var(--critical); color: var(--critical); }
.btn-block.on { background: var(--critical); border-color: var(--critical); color: #fff; }
tr.row-blocked { background: rgba(208,59,59,0.10); }
tr.row-blocked td { color: var(--muted); }
tr.row-blocked td:nth-child(2) { color: var(--critical); font-weight: 600; text-decoration: line-through; }
.logic-panel { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--gridline); }
.logic-part { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--page-plane); }
.logic-part h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--text-primary); }
.logic-q { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.logic-q > span { font-size: 12px; color: var(--text-secondary); min-width: 128px; }
.chip {
  font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
  border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
}
.chip:hover { border-color: var(--series-1); color: var(--series-1); }
.chip.on { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.logic-sum { font-size: 11px; color: var(--muted); }
.logic-done { color: var(--good); font-weight: 600; }
.empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
.section-head { font-size: 15px; font-weight: 600; margin: 28px 0 12px; color: var(--text-secondary); }
.badge-priv { font-size: 10px; color: var(--warning, #a06600); border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; margin-left: 4px; vertical-align: middle; }
footer.fine-print { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div id="toast" hidden></div>
<div class="page">
  <div class="topbar">
    <h1>게스트 성과 대시보드</h1>
    <span id="admin-badge" class="muted-text" hidden>관리자 모드</span>
  </div>

  <main id="app">
    <section id="gate-view" class="card center-card">
      <p>비밀번호를 입력하면 대시보드를 볼 수 있어요.</p>
      <form id="password-form">
        <input type="password" id="password-input" placeholder="비밀번호" autocomplete="off">
        <button type="submit" class="btn-primary">입장</button>
      </form>
      <p id="password-error" class="error-text" hidden>비밀번호가 올바르지 않아요.</p>
      <button id="admin-link" class="btn-ghost">관리자이신가요? Google로 로그인</button>
      <p id="signin-error" class="error-text" hidden></p>
    </section>

    <section id="dashboard-view" hidden>
      <div class="toolbar">
        <span id="last-updated" class="muted-text"></span>
        <button id="relogin-btn" class="btn-secondary" hidden>관리자 다시 로그인</button>
        <button id="refresh-btn" class="btn-secondary">새로고침</button>
        <button id="refresh-all-btn" class="btn-secondary" hidden>전체 새로고침</button>
        <button id="publish-btn" class="btn-secondary" hidden>게시하기</button>
      </div>
      <p id="sync-status" class="fine-print" hidden></p>
      <div id="scope-tabs" class="month-tabs scope-tabs"></div>
      <div id="archive-tabs" class="month-tabs sub-tabs" hidden></div>
      <div id="month-tabs" class="month-tabs"></div>
      <div id="guest-list"></div>
    </section>
  </main>

  <footer class="fine-print">데이터는 관리자가 갱신할 때마다 최신화됩니다.</footer>
</div>

<script>
// ====================================================================
// 설정
// ====================================================================
const CLIENT_ID = '525359194157-5b7i2n6cphveliqjnklavmddopg9p0ek.apps.googleusercontent.com';
const YOUTUBE_CHANNEL_ID = 'UCbOIEn95Rvnk97KRtSFqvbQ';   // 웅달 책방
const GUEST_PASSWORD = 'cjamm1206';
const CALENDAR_ID = 'biz@hijump.kr';                     // 🗓️ 웅달책방 캘린더
const CALENDAR_PREFIX = '[성준]';
// 팀원 섹터 — 캘린더 태그로 담당자를 구분해요. 세부 영상 목록 없이 평균만 보여줍니다.
const TEAM_MEMBERS = ['다혜', '준하'];   // 준혁님은 콘텐츠 형식이 달라 이 기준으로 집계되지 않아 제외
const TEAM_MONTHS = ['2026-07', '2026-08'];
// 팀원 지표에서 뺄 정규 코너 (게스트 성과가 아니라 프로그램이라 평균을 왜곡해요)
const TEAM_EXCLUDE_EVENT = /북클럽|밤의\s*독서/;
const EXCLUDE_KEYWORD = '특집';   // 특집 영상은 게스트 성과에서 제외
const MIN_PARTS = 3;              // 정규 녹화는 3부작 이상 (1·2부+풀버전은 라이브 편집본)
const SET_WINDOW_DAYS = 21;       // 촬영일 이후 이 기간 내 업로드분을 한 세트로 봄 (편집 지연 감안)
// 창의 마지막 날은 하루 전체를 포함해요 — 마지막 편이 몇 시에 올라오든 놓치지 않도록.
const TITLE_SUFFIX_RE = /(박사|교수님|교수|영업이사|대표|특파원|소장|부장|차장|이사|작가|위원|팀장|세무사|기자|센터장|법사|탈북민|고문|무극선생|선생|애널리스트|연구원|의원|변호사|회계사|관장|본부장|실장|위원장|사장|국장|처장|평론가|아나운서|강사|회장|원장|고문님|박사님|기자님)\s*$/;
// 이름 사이에 끼어드는 소속명 (예: "김경록 미래에셋 고문" → "김경록")
const AFFILIATION_RE = /\s*(미래에셋|삼성증권|한국투자|키움|NH투자|신한|하나|KB|메리츠)\s*/g;
// 저장소 채널들. channelId는 관리자 로그인 후 자동으로 채워져요.
const ARCHIVE_CHANNELS = [
  { key: '투자',   name: '웅달책방_투자',   channelId: 'UCK2Em4sKzvTZXsMM9BCS4_A' },
  { key: '교양',   name: '웅달책방_교양',   channelId: 'UCPSnZnPJIDIizqLzNBQlImw' },
  { key: '부동산', name: '웅달책방_부동산', channelId: 'UCddUfRViMKUSWm8-OstEGVA' }
];
const ARCHIVE_GROUPS = ['라이브', '통합본'];
// 네모경제 섹터 — 제목에 "(네모경제 김민규 대표)"가 붙은 코너 영상만 모아요.
// 김민규 대표가 정규 게스트로 직접 나오는 회차는 1·2부…풀버전 라벨이 붙고 본채널/게스트 섹터에서
// 이미 집계되므로, 라벨이 붙은 영상은 여기서 빼서 두 번 세지 않게 합니다.
const NEMO_KEYWORD = '네모경제';
const NEMO_PART_RE = /\d+\s*부|풀버전/;
// 유효 조회수(engagedViews) — 유튜브 스튜디오 '고급 모드'의 그 값이에요.
// Analytics API가 아직 안 주는 구간이 있어서, 실패하면 기본 지표만으로 다시 물어봅니다.
const ANALYTICS_METRICS = 'averageViewDuration,averageViewPercentage,engagedViews';
const ANALYTICS_METRICS_BASIC = 'averageViewDuration,averageViewPercentage';
const GITHUB_OWNER = 'sungjun-kr';
const GITHUB_REPO = 'sungjun-kr.github.io';
const DATA_PATH = 'data.json';
// ====================================================================

function partOrder(part) {
  if (part === '풀버전') return 9;
  const n = parseInt(part, 10);
  return isFinite(n) ? n : 8;
}

const SCOPES = [
  'https://www.googleapis.com/auth/calendar.readonly',
  'https://www.googleapis.com/auth/youtube.readonly',
  'https://www.googleapis.com/auth/yt-analytics.readonly'
].join(' ');

let tokenClient = null;
let accessToken = null;
let isAdmin = false;
let publishedData = null;
let activeMonth = null;
let activeScope = 'main';      // 'main'(본채널) | 'archive'(저장소) | 'team'(팀원)
let activeArchive = null;      // 저장소 카테고리 키 (투자/교양/부동산)

function $(id) { return document.getElementById(id); }

function fmtNum(n) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '–';
  return n.toLocaleString('ko-KR');
}
function fmtPct(n) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '–';
  return n.toFixed(2) + '%';
}
function fmtDuration(sec) {
  if (typeof sec !== 'number' || Number.isNaN(sec)) return '–';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return `${m}분 ${s}초`;
}

// ---------------- 게이트 (비밀번호 / 관리자 로그인) ----------------

$('password-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = $('password-input').value;
  if (val === GUEST_PASSWORD) {
    sessionStorage.setItem('guestAuthed', '1');
    $('password-error').hidden = true;
    enterDashboard(false);
  } else {
    $('password-error').hidden = false;
  }
});

// 팝업 대신 같은 창에서 구글 로그인 페이지로 이동한 뒤 돌아와요 (팝업 차단 영향 없음).
const REDIRECT_URI = location.origin + location.pathname;

// 토큰은 이 탭의 sessionStorage에만 보관해요 (탭을 닫으면 사라짐).
// 유효 기간(약 1시간) 동안은 페이지를 새로 열어도 다시 로그인하지 않아도 돼요.
function saveToken(token, expiresInSec) {
  const expiresAt = Date.now() + (Number(expiresInSec) || 3600) * 1000 - 60000; // 만료 1분 전까지만 유효 처리
  try { sessionStorage.setItem('gToken', JSON.stringify({ token, expiresAt })); } catch (e) {}
}
function loadToken() {
  try {
    const raw = sessionStorage.getItem('gToken');
    if (!raw) return null;
    const { token, expiresAt } = JSON.parse(raw);
    if (!token || !expiresAt || Date.now() >= expiresAt) { sessionStorage.removeItem('gToken'); return null; }
    return token;
  } catch (e) { return null; }
}

$('admin-link').addEventListener('click', () => {
  // 이미 유효한 토큰이 있으면 로그인 화면을 건너뛰어요.
  const existing = loadToken();
  if (existing) { accessToken = existing; enterDashboard(true); return; }
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'token',
    scope: SCOPES,
    include_granted_scopes: 'true',
    // 계정을 고를 수 있게 항상 선택 화면을 띄워요.
    // 시청 지표(Analytics)는 그 채널을 소유한 계정으로 로그인해야 나옵니다.
    prompt: 'select_account'
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
});

// 새로고침 — 지금 보고 있는 섹터(월)만 다시 가져와요.

// 현재 보고 있는 섹터 이름 (버튼 라벨용)
function currentSectorLabel() {
  const monthLbl = (() => {
    const ms = activeScope === 'archive'
      ? (((publishedData.archive && publishedData.archive.channels) || []).find(c => c.key === activeArchive) || {}).months || []
      : activeScope === 'team'
      ? (((publishedData.team && publishedData.team.members) || [])[0] || {}).months || []
      : (publishedData.months || []);
    let m = ms.find(x => x.month === activeMonth);
    // 네모경제는 본채널과 같은 달 목록을 쓰되, 아직 수집 안 한 달도 라벨이 나오게 해요.
    if (!m && activeScope === 'nemo' && activeMonth) {
      m = { label: `${activeMonth.slice(0, 4)}년 ${+activeMonth.slice(5)}월` };
    }
    return m ? m.label.replace(/^\d{4}년\s*/, '') : '';
  })();
  if (activeScope === 'archive') return `${activeArchive} ${monthLbl}`.trim();
  if (activeScope === 'team') return `팀원 ${monthLbl}`.trim();
  if (activeScope === 'nemo') return `네모경제 ${monthLbl}`.trim();
  if (activeScope === 'guests') return '게스트 목록';
  if (activeScope === 'analysis') return '분석';
  if (activeScope === 'topics') return '주제별';
  return monthLbl;
}

function updateRefreshLabel() {
  // 예전에 관리자로 들어왔는데 지금 토큰이 없으면 다시 로그인 버튼을 띄워요.
  const relogin = $('relogin-btn');
  if (relogin) {
    const wasAdmin = !!sessionStorage.getItem('gToken') || !!localStorage.getItem('gh_pat');
    relogin.hidden = !(wasAdmin && !accessToken);
  }
  const s = currentSectorLabel();
  // 게스트 목록은 기존 데이터로 계산되는 화면이라 새로고침 버튼이 필요 없어요.
  const derived = activeScope === 'guests' || activeScope === 'analysis';
  $('refresh-btn').hidden = derived;
  $('refresh-btn').textContent = s ? `${s} 새로고침` : '새로고침';
  const allBtn = $('refresh-all-btn');
  allBtn.hidden = derived || activeScope === 'topics' || !(isAdmin && accessToken);
  allBtn.textContent = activeScope === 'archive' ? '저장소 전체 새로고침'
    : activeScope === 'team' ? '팀원 전체 새로고침'
    : activeScope === 'nemo' ? '네모경제 전체 새로고침' : '본채널 전체 새로고침';
}

// 갱신 대상 월 목록 — 이미 있는 달 + 캘린더에 일정이 있는 달을 합쳐요 (새 달도 자동 포함).
async function monthsToRefreshMain() {
  const have = (publishedData.months || []).map(m => m.month);
  let fromCal = [];
  try {
    const events = await calendarCached();
    fromCal = [...new Set(events.map(e => monthKey(e.date)))];
  } catch (err) { console.warn('캘린더 월 목록 실패:', err.message); }
  return [...new Set([...have, ...fromCal])].sort();
}

function monthsToRefreshArchive() {
  const chans = (publishedData.archive && publishedData.archive.channels) || [];
  const have = chans.flatMap(c => (c.months || []).map(m => m.month));
  const now = new Date();
  const cur = monthKey(now);
  return [...new Set([...have, cur])].sort();
}

// 현재 섹터(본채널/저장소) 전체를 순서대로 갱신해요.
$('refresh-all-btn').addEventListener('click', async () => {
  const btn = $('refresh-all-btn');
  if (btn.disabled || !isAdmin || !accessToken) return;
  const label = btn.textContent;
  btn.disabled = true;
  $('refresh-btn').disabled = true;
  $('sync-status').hidden = false;
  const t0 = Date.now();
  clearRefreshCache();
  let done = 0, failed = [];
  try {
    if (activeScope === 'team') {
      const total = TEAM_MEMBERS.length * TEAM_MONTHS.length;
      for (const t of TEAM_MEMBERS) {
        for (const mk of TEAM_MONTHS) {
          btn.textContent = `수집 중… (${done + 1}/${total})`;
          $('sync-status').textContent = `팀원 「${t}」 ${mk} 수집 중…`;
          try { await refreshTeamMonth(t, mk); } catch (err) { failed.push(`${t} ${mk}`); }
          done++;
        }
      }
    } else if (activeScope === 'nemo') {
      const months = await monthsToRefreshMain();
      for (const m of months) {
        btn.textContent = `수집 중… (${done + 1}/${months.length})`;
        $('sync-status').textContent = `네모경제 ${m} 수집 중…`;
        try { await refreshNemoMonth(m); } catch (err) { failed.push(m); }
        done++;
      }
    } else if (activeScope === 'archive') {
      const months = monthsToRefreshArchive();
      const total = ARCHIVE_CHANNELS.length * months.length;
      for (const c of ARCHIVE_CHANNELS) {
        for (const m of months) {
          btn.textContent = `수집 중… (${done + 1}/${total})`;
          $('sync-status').textContent = `저장소 「${c.key}」 ${m} 수집 중…`;
          try { await refreshArchiveMonth(c.key, m); } catch (err) { failed.push(`${c.key} ${m}`); }
          done++;
        }
      }
    } else {
      const months = await monthsToRefreshMain();
      for (const m of months) {
        btn.textContent = `수집 중… (${done + 1}/${months.length})`;
        $('sync-status').textContent = `본채널 ${m} 수집 중…`;
        try { await refreshMainMonth(m); } catch (err) { failed.push(m); }
        done++;
      }
    }
    render();
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    $('sync-status').textContent = `전체 갱신 완료 — ${done}개 섹터 / ${secs}초`
      + (failed.length ? ` · 건너뜀: ${failed.join(', ')}` : '')
      + ' · "게시하기"를 눌러야 다른 사람에게도 반영돼요.';
  } catch (err) {
    console.error(err);
    $('sync-status').textContent = '오류가 발생했어요: ' + err.message;
  } finally {
    btn.disabled = false;
    $('refresh-btn').disabled = false;
    btn.textContent = label;
    updateRefreshLabel();
  }
});

// 구글 로그인에서 돌아왔는지 확인 (URL #access_token=...)
(function checkReturnedToken() {
  const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
  if (!hash) {
    // 로그인 리디렉션이 아니어도, 이 탭에 살아있는 토큰이 있으면 관리자 모드로 복원해요.
    const saved = loadToken();
    if (saved) { accessToken = saved; enterDashboard(true); return true; }
    return false;
  }
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  const err = params.get('error');
  history.replaceState(null, '', location.pathname);
  if (err) {
    $('signin-error').hidden = false;
    $('signin-error').textContent = '로그인이 취소되었거나 실패했어요: ' + err;
    return false;
  }
  if (token) {
    accessToken = token;
    saveToken(token, params.get('expires_in'));
    enterDashboard(true);
    return true;
  }
  return false;
})();

// ---------------- 게시된 데이터 불러오기 / 렌더링 ----------------

async function loadPublishedData() {
  try {
    const res = await fetch(`./${DATA_PATH}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('no data yet');
    publishedData = await res.json();
  } catch (err) {
    publishedData = { updatedAt: null, months: [] };
  }
  mergeSharedState();
  render();
}

// 게시본에 담긴 기록을 이 브라우저에도 반영해요 (다른 기기에서 적은 내용이 보이도록).
// 같은 항목을 양쪽에서 고쳤다면 이 브라우저 값이 우선입니다.
function mergeSharedState() {
  try {
    const pubLogic = publishedData.workLogic || {};
    const local = loadLogic();
    const merged = {};
    Object.entries(pubLogic).forEach(([k, v]) => { merged[k] = { ...v }; });
    Object.entries(local).forEach(([k, v]) => {
      merged[k] = { ...(merged[k] || {}) };
      Object.entries(v).forEach(([part, ans]) => { merged[k][part] = { ...(merged[k][part] || {}), ...ans }; });
    });
    saveLogic(merged);

    const set = loadBlocked();
    (publishedData.blocked || []).forEach(k => set.add(k));
    saveBlocked(set);
  } catch (e) { console.warn('공유 기록 병합 실패:', e.message); }
}

function render() {
  renderInner();
  // 보고 있는 섹터의 마지막 업데이트 시각과 버튼 라벨을 맞춰요.
  const ms = activeScope === 'archive'
    ? (((publishedData.archive && publishedData.archive.channels) || []).find(c => c.key === activeArchive) || {}).months || []
    : activeScope === 'team'
    ? (((publishedData.team && publishedData.team.members) || [])[0] || {}).months || []
    : activeScope === 'nemo'
    ? ((publishedData.nemo && publishedData.nemo.months) || [])
    : (publishedData.months || []);
  const cur = ms.find(m => m.month === activeMonth);
  const stamp = (cur && cur.updatedAt) || publishedData.updatedAt;
  const sector = currentSectorLabel();
  $('last-updated').textContent = stamp
    ? `${sector ? sector + ' ' : ''}마지막 업데이트: ${new Date(stamp).toLocaleString('ko-KR')}`
    : '아직 게시된 데이터가 없어요.';
  updateRefreshLabel();
}

function renderInner() {

  // 최상위 섹터: 본채널 / 저장소
  const archive = (publishedData.archive && publishedData.archive.channels) || [];
  const team = (publishedData.team && publishedData.team.members) || [];
  const scopeEl = $('scope-tabs');
  scopeEl.innerHTML = '';
  if (archive.length || team.length || isAdmin) {
    const defs = [['main', '본채널']];
    if ((publishedData.months || []).length) defs.push(['guests', '게스트']);
    if ((publishedData.months || []).some(m => m.month >= ANALYSIS_FROM)) defs.push(['analysis', '분석']);
    if ((publishedData.nemo && (publishedData.nemo.months || []).length) || isAdmin) defs.push(['nemo', '네모경제']);
    if (archive.length) defs.push(['archive', '저장소']);
    if (team.length || isAdmin) defs.push(['team', '팀원']);
    defs.forEach(([key, label]) => {
      const btn = document.createElement('button');
      btn.className = 'month-tab' + (activeScope === key ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => { activeScope = key; activeMonth = null; render(); });
      scopeEl.appendChild(btn);
    });
    // 주제별 TOP — 남는 오른쪽 공간에 작게 붙여요.
    const topBtn = document.createElement('button');
    topBtn.className = 'month-tab tab-right' + (activeScope === 'topics' ? ' active' : '');
    topBtn.textContent = '주제별 TOP';
    topBtn.addEventListener('click', () => { activeScope = 'topics'; activeMonth = null; render(); });
    scopeEl.appendChild(topBtn);
  }

  if (activeScope === 'guests') {
    renderGuestRanking();
    return;
  }

  if (activeScope === 'analysis') {
    renderAnalysis();
    return;
  }

  if (activeScope === 'topics') {
    renderTopics();
    return;
  }

  if (activeScope === 'nemo') {
    renderNemo();
    return;
  }

  if (activeScope === 'team') {
    renderTeam(team);
    return;
  }

  if (activeScope === 'archive' && archive.length) {
    renderArchive(archive);
    return;
  }

  $('archive-tabs').hidden = true;
  const months = publishedData.months || [];
  const tabsEl = $('month-tabs');
  tabsEl.innerHTML = '';
  if (!months.length) {
    $('guest-list').innerHTML = '<div class="empty-state">아직 표시할 데이터가 없어요.' + (isAdmin ? ' "데이터 새로 가져오기"를 눌러주세요.' : '') + '</div>';
    return;
  }
  if (!activeMonth || !months.find(m => m.month === activeMonth)) {
    activeMonth = months[months.length - 1].month;
  }
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'month-tab' + (m.month === activeMonth ? ' active' : '');
    btn.textContent = m.label;
    btn.addEventListener('click', () => { activeMonth = m.month; render(); });
    tabsEl.appendChild(btn);
  });

  const current = months.find(m => m.month === activeMonth);
  const curIdx = months.findIndex(m => m.month === activeMonth);
  const prevMonth = curIdx > 0 ? months[curIdx - 1] : null;   // 등급 변화 비교용 직전 달
  const listEl = $('guest-list');
  listEl.innerHTML = '';
  if (!current) {
    listEl.innerHTML = '<div class="empty-state">이 달에는 게스트가 없어요.</div>';
    return;
  }
  // 아직 업로드된 게스트가 없어도 촬영 예정 목록은 보여줘요 (다음 달 미리보기).
  if (!current.guests.length && !(current.pending || []).length) {
    listEl.innerHTML = '<div class="empty-state">이 달에는 게스트가 없어요.</div>';
    return;
  }
  if (!current.guests.length) {
    const msg = document.createElement('div');
    msg.className = 'fine-print';
    msg.style.marginBottom = '14px';
    msg.textContent = '아직 업로드된 게스트가 없어요. 캘린더에 잡힌 촬영 일정만 표시합니다.';
    listEl.appendChild(msg);
  }
  // 요약 (집계 완료된 게스트 기준) — 업로드가 진행 중인 게스트는 평균을 왜곡하니 기준선에서 빼요.
  const g5 = current.guests.filter(isComplete);
  const inProg = current.guests.filter(g => !isComplete(g));
  const totV = g5.reduce((s, g) => s + (g.totalViews || 0), 0);
  // 당월 게스트당 평균 조회수 — 각 게스트 총 조회수의 색상 기준선
  const monthAvgViews = g5.length ? totV / g5.length : null;
  if (g5.length) {
    const sumRow = document.createElement('div');
    sumRow.className = 'kpi-row';
    const totVid = g5.reduce((s, g) => s + (g.videoCount || (g.videos || []).length), 0);
    // 직전 달과 같은 방식으로 계산해 비교해요.
    const pg = (prevMonth && prevMonth.guests) ? prevMonth.guests.filter(isComplete) : [];
    const pTotV = pg.reduce((s, g) => s + (g.totalViews || 0), 0);
    const pTotVid = pg.reduce((s, g) => s + (g.videoCount || (g.videos || []).length), 0);
    const pPerGuest = pg.length ? Math.round(pTotV / pg.length) : null;
    const pPerVideo = pTotVid ? Math.round(pTotV / pTotVid) : null;
    const pLabel = prevMonth ? prevMonth.label : null;

    sumRow.appendChild(statTile('집계 완료 게스트', `${g5.length}명`,
      inProg.length ? `업로드 중 ${inProg.length}명` : null));
    sumRow.appendChild(appendDelta(statTile('합계 조회수', fmtNum(totV)),
      totV, pg.length ? pTotV : null, pLabel));
    sumRow.appendChild(appendDelta(statTile('게스트당 평균 조회수', fmtNum(Math.round(monthAvgViews))),
      Math.round(monthAvgViews), pPerGuest, pLabel));
    sumRow.appendChild(appendDelta(statTile('영상당 평균 조회수', totVid ? fmtNum(Math.round(totV / totVid)) : '–', `영상 ${totVid}편`),
      totVid ? Math.round(totV / totVid) : null, pPerVideo, pLabel));
    sumRow.appendChild(statTile('업로드 예정', `${(current.pending || []).length}명`));
    listEl.appendChild(sumRow);

    // 색상 범례
    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = '<span class="fine-print">당월 게스트 평균 대비 총 조회수:</span>'
      + '<span class="lg perf-high">+50% 이상</span>'
      + '<span class="lg perf-good">+20% 이상</span>'
      + '<span class="lg">평균권</span>'
      + '<span class="lg perf-warn">−20% 이하</span>'
      + '<span class="lg perf-bad">−50% 이하</span>';
    listEl.appendChild(legend);

    const gradeLegend = document.createElement('div');
    gradeLegend.className = 'legend';
    gradeLegend.innerHTML = '<span class="fine-print">등급(총 조회수 절대 기준):</span>'
      + '<span class="grade grade-S">S</span><span class="lg">20만↑</span>'
      + '<span class="grade grade-A">A</span><span class="lg">15만~20만</span>'
      + '<span class="grade grade-B">B</span><span class="lg">10만~15만</span>'
      + '<span class="grade grade-C">C</span><span class="lg">8만~10만</span>'
      + '<span class="grade grade-D">D</span><span class="lg">8만 이하</span>';
    listEl.appendChild(gradeLegend);
  }

  current.guests.forEach((g, idx) => {
    const card = document.createElement('div');
    card.className = 'guest-card';

    const vidCount = g.videoCount || (g.videos || []).length;
    const d = g.eventDate ? new Date(g.eventDate).toLocaleDateString('ko-KR') : '';

    // 클릭 가능한 헤더 (이름 + 요약)
    const header = document.createElement('button');
    header.className = 'guest-toggle';
    header.type = 'button';
    header.setAttribute('aria-expanded', 'false');

    const left = document.createElement('div');
    left.className = 'guest-toggle-left';
    const nameEl = document.createElement('span');
    nameEl.className = 'guest-name';
    nameEl.textContent = g.name;

    // 업로드가 아직 안 끝난 회차는 비교 지표 대신 '업로드 중'만 보여줘요.
    const done = isComplete(g);
    if (!done) {
      const b = document.createElement('span');
      b.className = 'badge-priv';
      b.style.marginLeft = '6px';
      b.textContent = '업로드 중';
      b.title = `아직 ${g.hasFull ? '편수가 부족해요' : '풀버전이 안 올라왔어요'} — 월 평균·게스트 랭킹 집계에서는 빠집니다.`;
      nameEl.appendChild(b);
    }

    // 이름 옆 등급 배지 (총 조회수 절대 기준)
    const grade = done ? gradeOf(g.totalViews) : null;
    if (grade) {
      const badge = document.createElement('span');
      badge.className = `grade grade-${grade}`;
      badge.textContent = grade;
      badge.title = `총 조회수 ${fmtNum(g.totalViews)} → ${grade}등급`;
      nameEl.appendChild(badge);
    }

    // 전월 대비 등급 변화 (같은 인물이 직전 달에도 출연한 경우)
    const chg = done ? gradeChange(g, prevMonth) : null;
    if (chg) {
      const el = document.createElement('span');
      const dir = chg.diff > 0 ? 'up' : (chg.diff < 0 ? 'down' : 'same');
      const arrow = chg.diff > 0 ? '▲' : (chg.diff < 0 ? '▼' : '=');
      el.className = `grade-chg chg-${dir}`;
      el.textContent = `${arrow} ${chg.from}→${chg.to}`;
      el.title = `${chg.prevLabel} ${chg.prevName} ${fmtNum(chg.prevViews)} (${chg.from}) → 이번 달 ${fmtNum(g.totalViews)} (${chg.to})`;
      nameEl.appendChild(el);
    }

    const metaEl = document.createElement('span');
    metaEl.className = 'guest-date';
    metaEl.textContent = `${d} · 영상 ${vidCount}편` + (g.note ? ` · ${g.note}` : '');
    left.appendChild(nameEl);
    left.appendChild(metaEl);

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '▾';

    header.appendChild(left);
    header.appendChild(chevron);
    card.appendChild(header);

    // 항상 보이는 요약 지표
    const kpiRow = document.createElement('div');
    kpiRow.className = 'kpi-row';
    // 총 조회수는 당월 게스트 평균과 비교해 색으로 표시해요.
    const perf = done ? perfLevel(g.totalViews, monthAvgViews) : { cls: null, sub: '업로드 완료 후 집계' };
    const totalTile = statTile('총 조회수', fmtNum(g.totalViews), perf.sub);
    const totalValEl = totalTile.querySelector('.stat-value');
    if (perf.cls) totalValEl.classList.add(perf.cls);
    // 평균 대비 아래에 '직전 출연 대비 증감'을 덧붙여요.
    const prevApp = done ? findPrevAppearance(g, months, curIdx) : null;
    if (prevApp && typeof prevApp.guest.totalViews === 'number') {
      const diff = g.totalViews - prevApp.guest.totalViews;
      const base = prevApp.guest.totalViews;
      const pct = base ? (diff / base) * 100 : null;
      const line = document.createElement('div');
      line.className = 'stat-sub ' + (diff > 0 ? 'chg-up' : (diff < 0 ? 'chg-down' : 'chg-same'));
      const sign = diff > 0 ? '+' : (diff < 0 ? '−' : '±');
      line.textContent = `직전 대비 ${sign}${fmtNum(Math.abs(diff))}`
        + (pct === null ? '' : ` (${diff > 0 ? '+' : (diff < 0 ? '−' : '')}${Math.abs(pct).toFixed(1)}%)`);
      line.title = `${prevApp.label} ${prevApp.guest.eventDate} 출연 ${fmtNum(base)} → 이번 ${fmtNum(g.totalViews)}`;
      totalTile.appendChild(line);
    } else {
      const line = document.createElement('div');
      line.className = 'stat-sub';
      line.style.color = 'var(--muted)';
      line.textContent = done ? '직전 출연 없음' : '업로드 진행 중';
      totalTile.appendChild(line);
    }
    kpiRow.appendChild(totalTile);
    kpiRow.appendChild(statTile('평균 조회수', fmtNum(g.avgViews)));
    kpiRow.appendChild(statTile('평균 시청 지속시간', fmtDuration(g.avgViewDurationSec)));
    kpiRow.appendChild(statTile('평균 시청률', fmtPct(g.avgViewPct)));
    // 유효 조회수 — 스튜디오 고급 모드 값. 참고용이라 평균·티어 계산에는 안 들어가요.
    kpiRow.appendChild(statTile('유효 조회수', fmtNum(g.totalEngagedViews), '참고용'));
    card.appendChild(kpiRow);

    // 클릭 시 펼쳐지는 편별 상세
    if (g.videos && g.videos.length) {
      const panel = document.createElement('div');
      panel.className = 'detail-panel';
      panel.hidden = true;

      const table = document.createElement('table');
      table.className = 'video-table';
      // 분석 섹터에 기록한 작업 로직을 편별로 함께 보여줘요.
      const logicRec = loadLogic()[logicKeyOf(g)] || {};
      const hasLogic = Object.keys(logicRec).length > 0;
      table.innerHTML = `<thead><tr><th>편</th><th>업로드</th><th>조회수</th><th>평균 시청시간</th><th>시청률</th>`
        + (hasLogic ? `<th>작업 로직</th>` : '') + `</tr></thead>`;
      const tbody = document.createElement('tbody');
      g.videos.forEach(v => {
        const tr = document.createElement('tr');
        const priv = (v.privacy && v.privacy !== 'public') ? ' <span class="badge-priv">비공개</span>' : '';
        const sum = logicSummary(logicRec[v.part]);
        tr.innerHTML = `<td>${escapeHtml(v.part || v.title)}${priv}</td><td>${escapeHtml(v.pub || '')}</td><td class="num">${fmtNum(v.views)}</td><td class="num">${fmtDuration(v.avgViewDurationSec)}</td><td class="num">${fmtPct(v.avgViewPct)}</td>`
          + (hasLogic ? `<td class="logic-sum">${sum ? escapeHtml(sum) : '–'}</td>` : '');
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      panel.appendChild(table);
      card.appendChild(panel);

      header.addEventListener('click', () => {
        const open = panel.hidden;
        panel.hidden = !open;
        header.setAttribute('aria-expanded', String(open));
        card.classList.toggle('open', open);
      });
    } else {
      header.classList.add('no-detail');
      chevron.hidden = true;
    }

    listEl.appendChild(card);
  });

  // 업로드 예정 섹션
  const pending = current.pending || [];
  if (pending.length) {
    const head = document.createElement('h2');
    head.className = 'section-head';
    head.textContent = `업로드 예정 (${pending.length}명)`;
    listEl.appendChild(head);

    const card = document.createElement('div');
    card.className = 'guest-card';
    const table = document.createElement('table');
    table.className = 'video-table';
    table.innerHTML = `<thead><tr><th>게스트</th><th>일정</th><th>상태</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    pending.forEach(p => {
      const tr = document.createElement('tr');
      const d = p.eventDate ? new Date(p.eventDate).toLocaleDateString('ko-KR') : '';
      tr.innerHTML = `<td>${escapeHtml(p.name)}</td><td>${escapeHtml(d)}</td><td>${escapeHtml(p.note || '')}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
    listEl.appendChild(card);
  }
}

// 분석 섹터 —// 분석 섹터 — 게스트별로 편마다 작업 로직을 기록해요 (지표 없이 기록 전용).
function renderAnalysis() {
  $('archive-tabs').hidden = true;
  const months = (publishedData.months || []).filter(m => m.month >= ANALYSIS_FROM);
  const tabsEl = $('month-tabs');
  tabsEl.innerHTML = '';
  const listEl = $('guest-list');
  listEl.innerHTML = '';
  if (!months.length) {
    listEl.innerHTML = '<div class="empty-state">분석할 달이 아직 없어요.</div>';
    return;
  }
  if (!activeMonth || !months.find(m => m.month === activeMonth)) activeMonth = months[0].month;
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'month-tab' + (m.month === activeMonth ? ' active' : '');
    btn.textContent = m.label;
    btn.addEventListener('click', () => { activeMonth = m.month; render(); });
    tabsEl.appendChild(btn);
  });

  const cur = months.find(m => m.month === activeMonth);
  // 업로드 끝난 게스트 + 예정 게스트를 촬영일 순으로 모두 나열해요.
  const entries = [
    ...(cur.guests || []).map(g => ({ name: g.name, eventDate: g.eventDate, done: true })),
    ...(cur.pending || []).map(p => ({ name: p.name, eventDate: p.eventDate, done: false, note: p.note }))
  ].sort((a, b) => String(a.eventDate).localeCompare(String(b.eventDate)));

  if (!entries.length) {
    listEl.innerHTML = '<div class="empty-state">이 달에는 게스트가 없어요.</div>';
    return;
  }

  const store = loadLogic();
  entries.forEach(ent => {
    const key = logicKeyOf(ent);
    const rec = store[key] || {};
    const filled = LOGIC_PARTS.filter(p => rec[p] && Object.keys(rec[p]).length).length;

    const card = document.createElement('div');
    card.className = 'guest-card';

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'guest-toggle';
    const left = document.createElement('div');
    left.className = 'guest-toggle-left';
    const nm = document.createElement('span');
    nm.className = 'guest-name';
    nm.textContent = ent.name;
    const meta = document.createElement('span');
    meta.className = 'guest-date';
    const d = ent.eventDate ? new Date(ent.eventDate) : null;
    meta.innerHTML = (d ? `${d.getMonth() + 1}월 ${d.getDate()}일` : '')
      + (ent.done ? '' : ` · <span style="color:var(--warning)">${escapeHtml(ent.note || '업로드 예정')}</span>`)
      + ` · <span class="${filled ? 'logic-done' : 'logic-sum'}">작업 로직 ${filled}/${LOGIC_PARTS.length}</span>`;
    left.appendChild(nm); left.appendChild(meta);
    const chev = document.createElement('span');
    chev.className = 'chevron';
    chev.textContent = '▾';
    head.appendChild(left); head.appendChild(chev);
    card.appendChild(head);

    const panel = document.createElement('div');
    panel.className = 'logic-panel';
    panel.hidden = true;
    LOGIC_PARTS.forEach(part => {
      const box = document.createElement('div');
      box.className = 'logic-part';
      const h = document.createElement('h4');
      h.textContent = part;
      box.appendChild(h);
      LOGIC_QUESTIONS.forEach(q => {
        const row = document.createElement('div');
        row.className = 'logic-q';
        const lab = document.createElement('span');
        lab.textContent = q.label;
        row.appendChild(lab);
        q.opts.forEach(opt => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip' + ((rec[part] && rec[part][q.key] === opt) ? ' on' : '');
          chip.textContent = opt;
          chip.addEventListener('click', () => {
            const all = loadLogic();
            all[key] = all[key] || {};
            all[key][part] = all[key][part] || {};
            // 같은 걸 다시 누르면 선택 해제돼요.
            if (all[key][part][q.key] === opt) delete all[key][part][q.key];
            else all[key][part][q.key] = opt;
            if (!Object.keys(all[key][part]).length) delete all[key][part];
            if (!Object.keys(all[key]).length) delete all[key];
            saveLogic(all);
            [...row.querySelectorAll('.chip')].forEach(c => c.classList.remove('on'));
            const now = loadLogic();
            if (now[key] && now[key][part] && now[key][part][q.key] === opt) chip.classList.add('on');
            const n = LOGIC_PARTS.filter(pp => now[key] && now[key][pp] && Object.keys(now[key][pp]).length).length;
            meta.querySelector('span:last-child').textContent = `작업 로직 ${n}/${LOGIC_PARTS.length}`;
            meta.querySelector('span:last-child').className = n ? 'logic-done' : 'logic-sum';
          });
          row.appendChild(chip);
        });
        box.appendChild(row);
      });
      panel.appendChild(box);
    });
    card.appendChild(panel);
    head.addEventListener('click', () => {
      panel.hidden = !panel.hidden;
      card.classList.toggle('open', !panel.hidden);
      head.setAttribute('aria-expanded', String(!panel.hidden));
    });
    listEl.appendChild(card);
  });

  const note = document.createElement('p');
  note.className = 'fine-print';
  note.textContent = '작업 로직은 입력 즉시 이 브라우저에 저장되고, "게시하기"를 누르면 사이트에도 올라가 다른 기기에서도 보여요. 기록한 내용은 본채널 각 게스트의 편별 표에도 함께 표시됩니다.';
  listEl.appendChild(note);
}

// 게스트 섹터 —// 게스트 섹터 — 지금까지 출연한 모든 게스트를 인물 단위로 묶어 1회 출연당 평균을 냅니다.
function buildGuestRanking() {
  const clusters = [];
  (publishedData.months || []).forEach(m => {
    (m.guests || []).forEach(g => {
      // 업로드가 끝나지 않은 회차는 1회당 평균을 왜곡하니 랭킹에서 빼요.
      if (!isComplete(g)) return;
      const key = guestKey(g.name);
      if (!key) return;
      let c = clusters.find(x => sameGuest(x.key, key));
      if (!c) { c = { key, name: g.name, appearances: [] }; clusters.push(c); }
      // 표시 이름은 가장 짧은 형태를 써요 ("부자아빠 정재호 대표" 대신 "정재호 대표").
      if (g.name.length < c.name.length) c.name = g.name;
      c.appearances.push({ month: m.month, label: m.label, date: g.eventDate,
                           views: g.totalViews || 0, videos: g.videoCount || 0,
                           pct: g.avgViewPct, dur: g.avgViewDurationSec });
    });
  });
  // 캘린더에 잡혔지만 아직 업로드되지 않은 일정 = 다음 촬영 예정
  const todayStr = new Date().toISOString().slice(0, 10);
  const upcoming = [];
  (publishedData.months || []).forEach(m => {
    (m.pending || []).forEach(p => {
      const key = guestKey(p.name);
      if (key && p.eventDate) upcoming.push({ key, date: p.eventDate });
    });
  });

  clusters.forEach(c => {
    c.appearances.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    c.count = c.appearances.length;
    c.totalViews = c.appearances.reduce((s, a) => s + a.views, 0);
    c.avgPerAppearance = c.count ? Math.round(c.totalViews / c.count) : 0;
    c.last = c.appearances[c.appearances.length - 1];
    c.tier = gradeOf(c.avgPerAppearance);
    // 시청 지표는 편수로 가중 평균해요 (편수가 많은 회차가 더 크게 반영되도록).
    const wsum = (k) => {
      let w = 0, v = 0;
      c.appearances.forEach(a => {
        if (typeof a[k] === 'number' && a.videos) { w += a.videos; v += a[k] * a.videos; }
      });
      return w ? v / w : null;
    };
    c.avgViewPct = wsum('pct');
    c.avgViewDurationSec = wsum('dur');
    // 추세: 마지막 회차가 직전 회차보다 얼마나 올랐는지 (2회 이상일 때만)
    if (c.count >= 2) {
      const a = c.appearances[c.count - 2].views, b = c.appearances[c.count - 1].views;
      c.trend = a ? (b - a) / a : null;
    } else {
      c.trend = null;
    }
    // 오늘 이후로 잡힌 일정 중 가장 빠른 것
    const mine = upcoming.filter(u => sameGuest(c.key, u.key) && u.date >= todayStr)
      .map(u => u.date).sort();
    c.nextDate = mine.length ? mine[0] : null;
  });
  // 티어가 높은 순서(S→D), 같은 티어 안에서는 평균이 높은 순서
  clusters.sort((a, b) => (GRADE_ORDER[b.tier] ?? -1) - (GRADE_ORDER[a.tier] ?? -1)
    || b.avgPerAppearance - a.avgPerAppearance);
  return clusters;
}

// ---------------- 작업 로직 기록 (분석 섹터) ----------------
const ANALYSIS_FROM = '2026-08';                       // 이 달부터 분석 섹터에 나와요
const LOGIC_PARTS = ['1부', '2부', '3부', '4부'];

  { key: 'thumb',  label: '썸네일 레퍼런스',      opts: ['1개', '2개', '3개 이상'] },

// 게스트 한 명을 가리키는 키 (같은 사람이 여러 번 나와도 회차별로 구분돼요)
function logicKeyOf(guest) {
  return `${guestKey(guest.name)}|${guest.eventDate}`;
}
// 한 편에 기록된 답을 "썸2 · 질문 적극적" 처럼 짧게 요약해요.
function logicSummary(rec) {
  if (!rec) return null;
  const bits = [];
  if (rec.thumb) bits.push('썸 ' + rec.thumb.replace(' 이상', '+'));
  if (rec.ref) bits.push('질문 ' + rec.ref);
  if (rec.timing) bits.push('시황 ' + rec.timing);
  if (rec.topicViews) bits.push('주제조회 ' + rec.topicViews.replace('조회수 ', ''));
  if (rec.meta) bits.push('메타 ' + rec.meta);
  return bits.length ? bits.join(' · ') : null;
}

// 섭외 판단 알고리즘
//  조회수가 가장 중요한 지표라 비중을 크게 두고(85%), 그 조회수 우위를 '표본 수'로 할인해요.
//  = 많이 나왔는데도 평균을 웃돈다면 진짜 실력, 한 번뿐이면 운일 수 있으니 덜 인정.
//  시청지속률 10% + 직전 회차 대비 추세 5%로 보조 지표를 얹습니다.
//  기준값 1.00 = 채널 평균 수준.
function bookingCall(r, base) {
  const viewIdx = base.views ? r.avgPerAppearance / base.views : 1;
  const retIdx = (base.pct && typeof r.avgViewPct === 'number') ? r.avgViewPct / base.pct : 1;
  const tr = typeof r.trend === 'number' ? Math.max(-0.5, Math.min(0.5, r.trend)) : 0;

  // 표본 신뢰도: 1회 50%에서 시작해 출연 1회마다 10%p씩 올라가고 100%에서 멈춰요.
  //  1회 50% / 2회 60% / 3회 70% / 4회 80% / 5회 90% / 6회 이상 100%
  const reliability = Math.min(1, 0.5 + (r.count - 1) * 0.1);
  // 평균을 웃돈 부분만 표본만큼 인정해요 (1회 성과는 운일 수 있으니 절반만).
  // 평균 아래는 그대로 반영합니다 — 그래야 조회수가 같을 때 출연이 많은 쪽이 항상 높게 나와요.
  const viewTerm = viewIdx >= 1 ? 1 + (viewIdx - 1) * reliability : viewIdx;

  // 출연 보너스 — 조회수가 같아도 많이 나온 게스트가 항상 더 높게 나오도록 더해요.
  //  1회 +0.00 / 2회 +0.03 / 3회 +0.06 / 4회 +0.09 / 5회 +0.12 / 6회 이상 +0.15
  const loyalty = (reliability - 0.5) / 0.5 * 0.15;
  const score = viewTerm * 0.85 + retIdx * 0.10 + (1 + tr) * 0.05 + loyalty;

  const pctTxt = (v) => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(0)}%`;
  const parts = [`조회 ${pctTxt((viewIdx - 1) * 100)}`];
  if (typeof r.avgViewPct === 'number' && base.pct) parts.push(`시청률 ${pctTxt((retIdx - 1) * 100)}`);
  if (typeof r.trend === 'number') parts.push(`추세 ${pctTxt(r.trend * 100)}`);
  parts.push(`${r.count}회 반영 ${(reliability * 100).toFixed(0)}%`
    + (loyalty > 0 ? ` · 출연보너스 +${loyalty.toFixed(2)}` : ''));

  let verdict, cls;
  if (score >= 1.30) { verdict = '적극 섭외'; cls = 'perf-high'; }
  else if (score >= 1.05) { verdict = '섭외 추천'; cls = 'perf-good'; }
  else if (score >= 0.85) { verdict = '유지'; cls = ''; }
  else if (score >= 0.65) { verdict = '재검토'; cls = 'perf-warn'; }
  else { verdict = '섭외 보류'; cls = 'perf-bad'; }
  // 1회 출연은 아무리 좋아도 '적극 섭외'까지는 올리지 않아요 (표본 부족).
  if (r.count === 1 && score >= 1.30) { verdict = '섭외 추천'; cls = 'perf-good'; }

  return { score, verdict, cls, reason: parts.join(' · ') };
}

function renderGuestRanking() {
  $('archive-tabs').hidden = true;
  $('month-tabs').innerHTML = '';
  const listEl = $('guest-list');
  listEl.innerHTML = '';

  const rows = buildGuestRanking();
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty-state">아직 게스트 데이터가 없어요.</div>';
    return;
  }
  // 기준선: 전체 게스트의 '1회 출연당 평균'들의 평균
  const overall = rows.reduce((s, r) => s + r.avgPerAppearance, 0) / rows.length;
  // 시청지속률 기준선 (값이 있는 게스트들의 평균)
  const withPct = rows.filter(r => typeof r.avgViewPct === 'number');
  const overallPct = withPct.length ? withPct.reduce((s, r) => s + r.avgViewPct, 0) / withPct.length : null;
  const base = { views: overall, pct: overallPct };
  rows.forEach(r => { r.call = bookingCall(r, base); });

  const sum = document.createElement('div');
  sum.className = 'kpi-row';
  sum.appendChild(statTile('총 게스트', `${rows.length}명`));
  sum.appendChild(statTile('총 출연', `${rows.reduce((s, r) => s + r.count, 0)}회`));
  sum.appendChild(statTile('1회 출연당 평균', fmtNum(Math.round(overall)), '이 값이 아래 % 기준선'));
  sum.appendChild(statTile('재출연 게스트', `${rows.filter(r => r.count > 1).length}명`));
  sum.appendChild(statTile('다음 촬영 예정', `${rows.filter(r => r.nextDate).length}명`));
  const blockedNow = loadBlocked();
  sum.appendChild(statTile('재출연 불가', `${rows.filter(r => blockedNow.has(r.key)).length}명`));
  listEl.appendChild(sum);

  const card = document.createElement('div');
  card.className = 'guest-card';
  const table = document.createElement('table');
  table.className = 'video-table';
  const blocked = loadBlocked();
  // 재출연 불가로 표시한 게스트는 순위에서 빼고 맨 아래로 내려요.
  rows.sort((a, b) => (blocked.has(a.key) ? 1 : 0) - (blocked.has(b.key) ? 1 : 0)
    || (GRADE_ORDER[b.tier] ?? -1) - (GRADE_ORDER[a.tier] ?? -1)
    || b.avgPerAppearance - a.avgPerAppearance);
  table.innerHTML = '<thead><tr><th>#</th><th>게스트</th><th>섭외</th><th>티어</th>'
    + '<th class="num">총 출연</th><th class="num">1회당 평균</th><th class="num">평균 대비</th>'
    + '<th class="num">시청률</th><th>최근 출연</th><th>다음 촬영</th><th>AI 분석</th></tr></thead>';
  const tbody = document.createElement('tbody');
  let rank = 0;
  rows.forEach((r) => {
    const tr = document.createElement('tr');
    const tier = r.tier;
    const isBlockedRow = blocked.has(r.key);
    if (!isBlockedRow) rank++;
    const i = rank - 1;
    const diff = overall ? (r.avgPerAppearance / overall - 1) * 100 : 0;
    // 최근 출연은 월·일까지 보여줘요 (연도는 생략).
    const ld = new Date(r.last.date);
    const lastDate = `${ld.getMonth() + 1}월 ${ld.getDate()}일`;
    const next = r.nextDate
      ? (() => { const n = new Date(r.nextDate); return `<span class="chg-up">${n.getMonth() + 1}월 ${n.getDate()}일</span>`; })()
      : '<span style="color:var(--muted)">일정 없음</span>';
    const cls = diff >= 50 ? 'perf-high' : diff >= 20 ? 'perf-good'
              : diff <= -50 ? 'perf-bad' : diff <= -20 ? 'perf-warn' : '';
    tr.innerHTML = `<td class="num">${isBlockedRow ? '–' : (i + 1)}</td>`
      + `<td>${escapeHtml(r.name)}</td>`
      + `<td></td>`
      + `<td>${tier ? `<span class="grade grade-${tier}">${tier}</span>` : '–'}</td>`
      + `<td class="num">${r.count}회</td>`
      + `<td class="num"><strong>${fmtNum(r.avgPerAppearance)}</strong></td>`
      + `<td class="num ${cls}">${diff > 0 ? '+' : ''}${diff.toFixed(1)}%</td>`
      + `<td class="num">${typeof r.avgViewPct === 'number' ? r.avgViewPct.toFixed(1) + '%' : '–'}</td>`
      + `<td>${escapeHtml(lastDate)}</td>`
      + `<td>${next}</td>`
      + `<td><span class="${r.call.cls}" style="font-weight:700">${r.call.verdict}</span>`
      + `<span class="stat-sub" style="margin-left:6px">${r.call.score.toFixed(2)}</span>`
      + `<div class="stat-sub">${escapeHtml(r.call.reason)}</div></td>`;
    // 재출연 불가 토글
    const isBlocked = blocked.has(r.key);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-block' + (isBlocked ? ' on' : '');
    btn.textContent = isBlocked ? '재출연 불가' : '가능';
    btn.title = '누르면 재출연 불가로 표시돼요. "게시하기"를 누르면 다른 기기에도 반영됩니다.';
    if (isBlocked) tr.classList.add('row-blocked');
    btn.addEventListener('click', () => {
      const set = loadBlocked();
      if (set.has(r.key)) { set.delete(r.key); } else { set.add(r.key); }
      saveBlocked(set);
      renderGuestRanking();   // 위치·순번이 바로 반영되도록 다시 그려요
    });
    tr.children[2].appendChild(btn);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  const wrap = document.createElement('div');
  wrap.style.overflowX = 'auto';
  wrap.appendChild(table);
  card.appendChild(wrap);
  listEl.appendChild(card);

  const note = document.createElement('p');
  note.className = 'fine-print';
  note.textContent = '본채널 집계분만 대상이에요. 여러 번 출연한 게스트는 한 줄로 묶어 1회 출연당 평균을 냈고, '
    + '티어는 그 평균값 기준입니다 (S 20만 / A 15만 / B 10만 / C 8만 초과 / D 그 이하). '
    + '평균 대비 %는 전체 게스트의 1회 출연당 평균과 비교한 값이에요. 다음 촬영은 캘린더에 잡힌 예정 일정을 보여주며, 없으면 “일정 없음”으로 표시합니다.';
  const note2 = document.createElement('p');
  note2.className = 'fine-print';
  note2.innerHTML = '<strong>AI 분석</strong> — 조회수를 가장 크게(85%) 보고, 그 우위를 <b>표본 수로 할인</b>합니다. '
    + '1회 출연은 50%만 인정하고 출연이 한 번 늘 때마다 10%p씩 올라가 6회 이상이면 100% 반영해요 '
    + '(1회 50% · 2회 60% · 3회 70% · 4회 80% · 5회 90% · 6회↑ 100%). '
    + '많이 나왔는데도 평균을 웃돌면 실력, 한 번뿐이면 운일 수 있다는 뜻입니다. '
    + '여기에 시청지속률 10% + 직전 회차 대비 추세 5%를 더하고, 출연 횟수만큼 보너스를 얹어요 '
    + '(2회 +0.03 · 3회 +0.06 · 4회 +0.09 · 5회 +0.12 · 6회↑ +0.15). '
    + '덕분에 조회수가 같으면 더 많이 출연한 게스트가 항상 높게 나옵니다. 1.00이 채널 평균 수준이고, '
    + '<b>적극 섭외</b> 1.30↑ · <b>섭외 추천</b> 1.05↑ · <b>유지</b> 0.85↑ · <b>재검토</b> 0.65↑ · <b>섭외 보류</b> 그 아래예요. '
    + '1회 출연은 점수가 아무리 높아도 적극 섭외로 올리지 않습니다. '
    + '클릭률은 브라우저에서 가져올 수 없어 빠져 있고, 숫자만 본 참고값이니 콘텐츠 맥락과 함께 보셔야 합니다.';
  listEl.appendChild(note2);
  listEl.appendChild(note);
}

// 팀원 섹터 — 담당자별 평균 조회수만 한눈에 보여줘요.

  $('archive-tabs').hidden = true;
  const allMonths = [...new Set(members.flatMap(m => m.months.map(x => x.month)))].sort();
  if (!allMonths.length) {
    $('guest-list').innerHTML = '<div class="empty-state">아직 팀원 데이터가 없어요.'
      + (isAdmin ? ' "팀원 전체 새로고침"을 눌러주세요.' : '') + '</div>';

  }
  if (!activeMonth || !allMonths.includes(activeMonth)) activeMonth = allMonths[allMonths.length - 1];

  const tabsEl = $('month-tabs');
  tabsEl.innerHTML = '';
  allMonths.forEach(mk => {
    const btn = document.createElement('button');
    btn.className = 'month-tab' + (mk === activeMonth ? ' active' : '');
    btn.textContent = `${mk.slice(0, 4)}년 ${+mk.slice(5)}월`;

    card.appendChild(head);

    row.className = 'kpi-row';

    card.appendChild(row);

  const note = document.createElement('p');

  wrap.appendChild(note);
}

// ---------------- 네모경제 (코너 영상) ----------------
// 제목에 "네모경제"가 들어간 코너 영상만 모아요.
// 김민규 대표가 정규 게스트로 직접 출연한 회차는 편 라벨(1·2부…풀버전)이 붙어 있고
// 본채널·게스트 섹터에서 이미 세므로, 여기서는 라벨이 붙은 영상을 빼서 겹치지 않게 합니다.

// 한 달치 요약 — 쇼츠는 수집 단계에서 이미 빠지지만, 예전 데이터를 위해 여기서도 한 번 더 걸러요.
function nemoAgg(m) {
  const vs = ((m && m.videos) || []).filter(v => !v.isShort);
  const total = vs.reduce((s, v) => s + (v.views || 0), 0);
  const ev = vs.map(v => v.engagedViews).filter(x => typeof x === 'number');
  const pv = vs.filter(v => typeof v.avgViewPct === 'number');
  const dv = vs.filter(v => typeof v.avgViewDurationSec === 'number');
  return {
    count: vs.length,
    total,
    avg: vs.length ? Math.round(total / vs.length) : null,
    pct: pv.length ? pv.reduce((s, v) => s + v.avgViewPct, 0) / pv.length : null,
    dur: dv.length ? Math.round(dv.reduce((s, v) => s + v.avgViewDurationSec, 0) / dv.length) : null,
    // 유효 조회수는 전부 받았을 때만 합계를 냅니다 (참고용).
    eng: ev.length === vs.length && ev.length ? ev.reduce((a, b) => a + b, 0) : null
  };
}

function renderNemo() {
  $('archive-tabs').hidden = true;
  const tabsEl = $('month-tabs');
  tabsEl.innerHTML = '';
  const listEl = $('guest-list');
  listEl.innerHTML = '';

  const src = (publishedData.nemo && publishedData.nemo.months) || [];
  // 달 목록은 본채널과 맞춰요 — 아직 안 모은 달도 눌러서 새로고침할 수 있게.
  const tabs = (publishedData.months || []).map(m => ({ month: m.month, label: m.label }));
  src.forEach(m => { if (!tabs.find(t => t.month === m.month)) tabs.push({ month: m.month, label: m.label }); });
  tabs.sort((a, b) => (a.month < b.month ? -1 : 1));

  if (!tabs.length) {
    listEl.innerHTML = '<div class="empty-state">아직 표시할 데이터가 없어요.</div>';
    return;
  }
  if (!activeMonth || !tabs.find(t => t.month === activeMonth)) activeMonth = tabs[tabs.length - 1].month;
  tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'month-tab' + (t.month === activeMonth ? ' active' : '');
    btn.textContent = t.label;
    btn.addEventListener('click', () => { activeMonth = t.month; render(); });
    tabsEl.appendChild(btn);
  });

  const idx = tabs.findIndex(t => t.month === activeMonth);
  const cur = src.find(m => m.month === activeMonth);
  const prev = idx > 0 ? src.find(m => m.month === tabs[idx - 1].month) : null;
  const prevLabel = idx > 0 ? tabs[idx - 1].label : null;

  if (!cur) {
    listEl.innerHTML = '<div class="empty-state">이 달은 아직 수집하지 않았어요.'
      + (isAdmin ? ' 위 "네모경제 ' + tabs[idx].label.replace(/^\d{4}년\s*/, '') + ' 새로고침"을 눌러주세요.' : '') + '</div>';
    return;
  }

  const a = nemoAgg(cur);
  const pa = prev ? nemoAgg(prev) : null;
  // 쇼츠는 목록에서도 빼요.
  const rows = (cur.videos || []).filter(v => !v.isShort);

  const sum = document.createElement('div');

  sum.appendChild(appendDelta(statTile('영상당 평균 조회수', a.avg === null ? '–' : fmtNum(a.avg)),
    a.avg, pa ? pa.avg : null, prevLabel));
  sum.appendChild(statTile('평균 시청 지속시간', fmtDuration(a.dur)));
  sum.appendChild(statTile('평균 시청률', fmtPct(a.pct)));
  sum.appendChild(statTile('유효 조회수', fmtNum(a.eng), '참고용'));
  listEl.appendChild(sum);

  if (!rows.length) {
    const e = document.createElement('div');
    e.className = 'empty-state';

  } else {
    const card = document.createElement('div');

    table.innerHTML = '<thead><tr><th>제목</th><th>업로드</th><th class="num">조회수</th>'
      + '<th class="num">평균 시청시간</th><th class="num">시청률</th></tr></thead>';
    const tbody = document.createElement('tbody');
    // 최신 업로드가 위로 오게 정렬해요.
    rows.sort((x, y) => (x.pub < y.pub ? 1 : -1));
    rows.forEach(v => {
      const tr = document.createElement('tr');
      const perf = perfLevel(v.views, a.avg);
      const priv = (v.privacy && v.privacy !== 'public') ? ' <span class="badge-priv">비공개</span>' : '';
      tr.innerHTML = `<td>${escapeHtml(v.title || '')}${priv}</td>`
        + `<td>${escapeHtml(v.pub || '')}</td>`
        + `<td class="num${perf.cls ? ' ' + perf.cls : ''}">${fmtNum(v.views)}`
        + (perf.sub ? `<div class="stat-sub">${perf.sub}</div>` : '') + '</td>'
        + `<td class="num">${fmtDuration(v.avgViewDurationSec)}</td>`
        + `<td class="num">${fmtPct(v.avgViewPct)}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
    listEl.appendChild(card);
  }

  const note = document.createElement('p');
  note.className = 'fine-print';
  note.textContent = '본채널(웅달책방)에 올라온 영상 중 제목에 "네모경제"가 들어간 코너 영상만 모았어요. '
    + '김민규 대표가 정규 게스트로 직접 출연한 회차는 편 라벨(1·2부…풀버전)이 붙어 본채널·게스트 섹터에서 이미 집계되므로, '
    + '여기서는 라벨이 붙은 영상을 빼서 두 번 세지 않습니다. 쇼츠(3분 미만)는 목록과 지표에서 모두 제외합니다. '
    + '업로드된 달을 기준으로 나눕니다.';
  listEl.appendChild(note);
}

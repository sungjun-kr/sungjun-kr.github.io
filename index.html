<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게스트 성과 대시보드</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page-plane: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --gridline: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --critical: #d03b3b;
  --good: #0ca30c;
  --warning: #a06600;
  --perf-blue: #1f6fd0;
  --perf-green: #0a8f0a;
  --perf-yellow: #a06600;
  --perf-red: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page-plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --gridline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --critical: #e66767;
    --good: #24c724;
    --warning: #fab219;
    --perf-blue: #5aa9ff;
    --perf-green: #3ddc3d;
    --perf-yellow: #fab219;
    --perf-red: #ff7b7b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page-plane); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.page { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.topbar h1 { font-size: 20px; font-weight: 600; margin: 0; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.center-card { max-width: 420px; margin: 80px auto; text-align: center; }
.center-card p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
input[type="password"], input[type="text"] {
  width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary);
  margin-bottom: 10px; font-family: inherit;
}
.btn-primary, .btn-secondary, .btn-ghost {
  font-family: inherit; font-size: 14px; font-weight: 600;
  border-radius: 8px; cursor: pointer; padding: 10px 18px; border: 1px solid transparent;
}
.btn-primary { background: var(--series-1); color: #fff; width: 100%; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border); padding: 8px 14px; }
.btn-ghost { background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; padding: 6px; text-decoration: underline; }
.fine-print { font-size: 12px; color: var(--muted); line-height: 1.6; }
.error-text { font-size: 13px; color: var(--critical); margin-top: 10px; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.muted-text { color: var(--muted); font-size: 13px; margin-right: auto; }
.month-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.scope-tabs { margin-bottom: 12px; }
.scope-tabs .month-tab { font-size: 14px; padding: 9px 20px; }
.sub-tabs { margin-bottom: 12px; }
.sub-tabs .month-tab { font-size: 12px; padding: 6px 13px; }
.month-tab {
  padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer;
}
.month-tab.active { background: var(--series-1); color: #fff; border-color: var(--series-1); }
.guest-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; }
.guest-card h3 { margin: 0 0 4px; font-size: 16px; }
.guest-date { color: var(--muted); font-size: 12px; }

.guest-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; background: none; border: none; padding: 0 0 12px; margin: 0;
  font-family: inherit; text-align: left; cursor: pointer; color: inherit;
}
.guest-toggle.no-detail { cursor: default; }
.guest-toggle-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.guest-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.guest-toggle:hover:not(.no-detail) .guest-name { color: var(--series-1); }
.chevron { color: var(--muted); font-size: 13px; flex-shrink: 0; transition: transform 0.15s; }
.guest-card.open .chevron { transform: rotate(180deg); }
.detail-panel { margin-top: 14px; padding-top: 4px; border-top: 1px solid var(--gridline); }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-tile { background: var(--page-plane); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.stat-value { font-size: 20px; font-weight: 600; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* 당월 평균 대비 성과 색상 */
.perf-high { color: var(--perf-blue); }
.perf-good { color: var(--perf-green); }
.perf-warn { color: var(--perf-yellow); }
.perf-bad  { color: var(--perf-red); }

.legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -8px 0 18px; }
.legend .lg { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.legend .lg.perf-high { color: var(--perf-blue); }
.legend .lg.perf-good { color: var(--perf-green); }
.legend .lg.perf-warn { color: var(--perf-yellow); }
.legend .lg.perf-bad  { color: var(--perf-red); }
.video-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.video-table th, .video-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--gridline); }
.video-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.video-table td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
.section-head { font-size: 15px; font-weight: 600; margin: 28px 0 12px; color: var(--text-secondary); }
.badge-priv { font-size: 10px; color: var(--warning, #a06600); border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; margin-left: 4px; vertical-align: middle; }
footer.fine-print { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1>게스트 성과 대시보드</h1>
    <span id="admin-badge" class="muted-text" hidden>관리자 모드</span>
  </div>

  <main id="app">
    <section id="gate-view" class="card center-card">
      <p>비밀번호를 입력하면 대시보드를 볼 수 있어요.</p>
      <form id="password-form">
        <input type="password" id="password-input" placeholder="비밀번호" autocomplete="off">
        <button type="submit" class="btn-primary">입장</button>
      </form>
      <p id="password-error" class="error-text" hidden>비밀번호가 올바르지 않아요.</p>
      <button id="admin-link" class="btn-ghost">관리자이신가요? Google로 로그인</button>
      <p id="signin-error" class="error-text" hidden></p>
    </section>

    <section id="dashboard-view" hidden>
      <div class="toolbar">
        <span id="last-updated" class="muted-text"></span>
        <button id="sync-btn" class="btn-secondary" hidden>데이터 새로 가져오기</button>
        <button id="publish-btn" class="btn-secondary" hidden>게시하기</button>
        <button id="exit-btn" class="btn-ghost">나가기</button>
      </div>
      <p id="sync-status" class="fine-print" hidden></p>
      <div id="scope-tabs" class="month-tabs scope-tabs"></div>
      <div id="archive-tabs" class="month-tabs sub-tabs" hidden></div>
      <div id="month-tabs" class="month-tabs"></div>
      <div id="guest-list"></div>
    </section>
  </main>

  <footer class="fine-print">데이터는 관리자가 갱신할 때마다 최신화됩니다.</footer>
</div>

<script>
// ====================================================================
// 설정
// ====================================================================
const CLIENT_ID = '525359194157-5b7i2n6cphveliqjnklavmddopg9p0ek.apps.googleusercontent.com';
const YOUTUBE_CHANNEL_ID = 'UCbOIEn95Rvnk97KRtSFqvbQ';   // 웅달 책방
const GUEST_PASSWORD = 'cjamm1206';
const CALENDAR_ID = 'biz@hijump.kr';                     // 🗓️ 웅달책방 캘린더
const CALENDAR_PREFIX = '[성준]';
const EXCLUDE_KEYWORD = '특집';   // 특집 영상은 게스트 성과에서 제외
const MIN_PARTS = 3;              // 정규 녹화는 3부작 이상 (1·2부+풀버전은 라이브 편집본)
const SET_WINDOW_DAYS = 14;       // 촬영일 이후 이 기간 내 업로드분을 한 세트로 봄 (편집 지연 감안)
const REACH_REPORT_TYPE = 'channel_reach_basic_a1';  // 클릭률(썸네일 노출 CTR) 리포트
const TITLE_SUFFIX_RE = /(박사|교수님|교수|영업이사|대표|특파원|소장|부장|차장|이사|작가|위원|팀장|세무사|기자|센터장|법사|탈북민)\s*$/;
// 저장소 채널들. channelId는 관리자 로그인 후 자동으로 채워져요.
const ARCHIVE_CHANNELS = [
  { key: '투자',   name: '웅달책방_투자',   channelId: 'UCK2Em4sKzvTZXsMM9BCS4_A' },
  { key: '교양',   name: '웅달책방_교양',   channelId: 'UCPSnZnPJIDIizqLzNBQlImw' },
  { key: '부동산', name: '웅달책방_부동산', channelId: 'UCddUfRViMKUSWm8-OstEGVA' }
];
const ARCHIVE_GROUPS = ['라이브', '통합본'];
const GITHUB_OWNER = 'sungjun-kr';
const GITHUB_REPO = 'sungjun-kr.github.io';
const DATA_PATH = 'data.json';
// ====================================================================

function partOrder(part) {
  if (part === '풀버전') return 9;
  const n = parseInt(part, 10);
  return isFinite(n) ? n : 8;
}

const SCOPES = [
  'https://www.googleapis.com/auth/calendar.readonly',
  'https://www.googleapis.com/auth/youtube.readonly',
  'https://www.googleapis.com/auth/yt-analytics.readonly'
].join(' ');

let tokenClient = null;
let accessToken = null;
let isAdmin = false;
let publishedData = null;
let activeMonth = null;
let activeScope = 'main';      // 'main'(본채널) | 'archive'(저장소)
let activeArchive = null;      // 저장소 카테고리 키 (투자/교양/부동산)

function $(id) { return document.getElementById(id); }

function fmtNum(n) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '–';
  return n.toLocaleString('ko-KR');
}
function fmtPct(n) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '–';
  return n.toFixed(2) + '%';
}
function fmtDuration(sec) {
  if (typeof sec !== 'number' || Number.isNaN(sec)) return '–';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return `${m}분 ${s}초`;
}

// ---------------- 게이트 (비밀번호 / 관리자 로그인) ----------------

$('password-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = $('password-input').value;
  if (val === GUEST_PASSWORD) {
    sessionStorage.setItem('guestAuthed', '1');
    $('password-error').hidden = true;
    enterDashboard(false);
  } else {
    $('password-error').hidden = false;
  }
});

// 팝업 대신 같은 창에서 구글 로그인 페이지로 이동한 뒤 돌아와요 (팝업 차단 영향 없음).
const REDIRECT_URI = location.origin + location.pathname;

// 토큰은 이 탭의 sessionStorage에만 보관해요 (탭을 닫으면 사라짐).
// 유효 기간(약 1시간) 동안은 페이지를 새로 열어도 다시 로그인하지 않아도 돼요.
function saveToken(token, expiresInSec) {
  const expiresAt = Date.now() + (Number(expiresInSec) || 3600) * 1000 - 60000; // 만료 1분 전까지만 유효 처리
  try { sessionStorage.setItem('gToken', JSON.stringify({ token, expiresAt })); } catch (e) {}
}
function loadToken() {
  try {
    const raw = sessionStorage.getItem('gToken');
    if (!raw) return null;
    const { token, expiresAt } = JSON.parse(raw);
    if (!token || !expiresAt || Date.now() >= expiresAt) { sessionStorage.removeItem('gToken'); return null; }
    return token;
  } catch (e) { return null; }
}

$('admin-link').addEventListener('click', () => {
  // 이미 유효한 토큰이 있으면 로그인 화면을 건너뛰어요.
  const existing = loadToken();
  if (existing) { accessToken = existing; enterDashboard(true); return; }
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'token',
    scope: SCOPES,
    include_granted_scopes: 'true'
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
});

$('exit-btn').addEventListener('click', () => {
  sessionStorage.removeItem('guestAuthed');
  sessionStorage.removeItem('gToken');
  accessToken = null;
  isAdmin = false;
  $('dashboard-view').hidden = true;
  $('gate-view').hidden = false;
  $('admin-badge').hidden = true;
});

// 구글 로그인에서 돌아왔는지 확인 (URL #access_token=...)
(function checkReturnedToken() {
  const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
  if (!hash) {
    // 로그인 리디렉션이 아니어도, 이 탭에 살아있는 토큰이 있으면 관리자 모드로 복원해요.
    const saved = loadToken();
    if (saved) { accessToken = saved; enterDashboard(true); return true; }
    return false;
  }
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  const err = params.get('error');
  history.replaceState(null, '', location.pathname);
  if (err) {
    $('signin-error').hidden = false;
    $('signin-error').textContent = '로그인이 취소되었거나 실패했어요: ' + err;
    return false;
  }
  if (token) {
    accessToken = token;
    saveToken(token, params.get('expires_in'));
    enterDashboard(true);
    return true;
  }
  return false;
})();

if (!accessToken && sessionStorage.getItem('guestAuthed') === '1') {
  enterDashboard(false);
}

async function enterDashboard(admin) {
  isAdmin = admin;
  $('gate-view').hidden = true;
  $('dashboard-view').hidden = false;
  $('admin-badge').hidden = !admin;
  $('sync-btn').hidden = !admin;
  $('publish-btn').hidden = !admin;
  await loadPublishedData();
}

// ---------------- 게시된 데이터 불러오기 / 렌더링 ----------------

async function loadPublishedData() {
  try {
    const res = await fetch(`./${DATA_PATH}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('no data yet');
    publishedData = await res.json();
  } catch (err) {
    publishedData = { updatedAt: null, months: [] };
  }
  render();
}

function render() {
  $('last-updated').textContent = publishedData.updatedAt
    ? `마지막 업데이트: ${new Date(publishedData.updatedAt).toLocaleString('ko-KR')}`
    : '아직 게시된 데이터가 없어요.';

  // 최상위 섹터: 본채널 / 저장소
  const archive = (publishedData.archive && publishedData.archive.channels) || [];
  const scopeEl = $('scope-tabs');
  scopeEl.innerHTML = '';
  if (archive.length) {
    [['main', '본채널'], ['archive', '저장소']].forEach(([key, label]) => {
      const btn = document.createElement('button');
      btn.className = 'month-tab' + (activeScope === key ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => { activeScope = key; activeMonth = null; render(); });
      scopeEl.appendChild(btn);
    });
  }

  if (activeScope === 'archive' && archive.length) {
    renderArchive(archive);
    return;
  }

  $('archive-tabs').hidden = true;
  const months = publishedData.months || [];
  const tabsEl = $('month-tabs');
  tabsEl.innerHTML = '';
  if (!months.length) {
    $('guest-list').innerHTML = '<div class="empty-state">아직 표시할 데이터가 없어요.' + (isAdmin ? ' "데이터 새로 가져오기"를 눌러주세요.' : '') + '</div>';
    return;
  }
  if (!activeMonth || !months.find(m => m.month === activeMonth)) {
    activeMonth = months[months.length - 1].month;
  }
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'month-tab' + (m.month === activeMonth ? ' active' : '');
    btn.textContent = m.label;
    btn.addEventListener('click', () => { activeMonth = m.month; render(); });
    tabsEl.appendChild(btn);
  });

  const current = months.find(m => m.month === activeMonth);
  const listEl = $('guest-list');
  listEl.innerHTML = '';
  if (!current || !current.guests.length) {
    listEl.innerHTML = '<div class="empty-state">이 달에는 게스트가 없어요.</div>';
    return;
  }
  // 요약 (집계 완료된 게스트 기준)
  const g5 = current.guests;
  const totV = g5.reduce((s, g) => s + (g.totalViews || 0), 0);
  // 당월 게스트당 평균 조회수 — 각 게스트 총 조회수의 색상 기준선
  const monthAvgViews = g5.length ? totV / g5.length : null;
  if (g5.length) {
    const sumRow = document.createElement('div');
    sumRow.className = 'kpi-row';
    const totVid = g5.reduce((s, g) => s + (g.videoCount || (g.videos || []).length), 0);
    sumRow.appendChild(statTile('집계 완료 게스트', `${g5.length}명`));
    sumRow.appendChild(statTile('합계 조회수', fmtNum(totV)));
    sumRow.appendChild(statTile('게스트당 평균 조회수', fmtNum(Math.round(monthAvgViews))));
    sumRow.appendChild(statTile('영상당 평균 조회수', totVid ? fmtNum(Math.round(totV / totVid)) : '–', `영상 ${totVid}편`));
    sumRow.appendChild(statTile('업로드 예정', `${(current.pending || []).length}명`));
    listEl.appendChild(sumRow);

    // 색상 범례
    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = '<span class="fine-print">당월 게스트 평균 대비 총 조회수:</span>'
      + '<span class="lg perf-high">+50% 이상</span>'
      + '<span class="lg perf-good">+20% 이상</span>'
      + '<span class="lg">평균권</span>'
      + '<span class="lg perf-warn">−20% 이하</span>'
      + '<span class="lg perf-bad">−50% 이하</span>';
    listEl.appendChild(legend);
  }

  current.guests.forEach((g, idx) => {
    const card = document.createElement('div');
    card.className = 'guest-card';

    const vidCount = g.videoCount || (g.videos || []).length;
    const d = g.eventDate ? new Date(g.eventDate).toLocaleDateString('ko-KR') : '';

    // 클릭 가능한 헤더 (이름 + 요약)
    const header = document.createElement('button');
    header.className = 'guest-toggle';
    header.type = 'button';
    header.setAttribute('aria-expanded', 'false');

    const left = document.createElement('div');
    left.className = 'guest-toggle-left';
    const nameEl = document.createElement('span');
    nameEl.className = 'guest-name';
    nameEl.textContent = g.name;
    const metaEl = document.createElement('span');
    metaEl.className = 'guest-date';
    metaEl.textContent = `${d} · 영상 ${vidCount}편` + (g.note ? ` · ${g.note}` : '');
    left.appendChild(nameEl);
    left.appendChild(metaEl);

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '▾';

    header.appendChild(left);
    header.appendChild(chevron);
    card.appendChild(header);

    // 항상 보이는 요약 지표
    const kpiRow = document.createElement('div');
    kpiRow.className = 'kpi-row';
    // 총 조회수는 당월 게스트 평균과 비교해 색으로 표시해요.
    const perf = perfLevel(g.totalViews, monthAvgViews);
    const totalTile = statTile('총 조회수', fmtNum(g.totalViews), perf.sub);
    const totalValEl = totalTile.querySelector('.stat-value');
    if (perf.cls) totalValEl.classList.add(perf.cls);
    kpiRow.appendChild(totalTile);
    kpiRow.appendChild(statTile('평균 조회수', fmtNum(g.avgViews)));
    kpiRow.appendChild(statTile('평균 클릭률', fmtPct(g.avgCtr)));
    kpiRow.appendChild(statTile('평균 시청 지속시간', fmtDuration(g.avgViewDurationSec)));
    kpiRow.appendChild(statTile('평균 시청률', fmtPct(g.avgViewPct)));
    card.appendChild(kpiRow);

    // 클릭 시 펼쳐지는 편별 상세
    if (g.videos && g.videos.length) {
      const panel = document.createElement('div');
      panel.className = 'detail-panel';
      panel.hidden = true;

      const table = document.createElement('table');
      table.className = 'video-table';
      table.innerHTML = `<thead><tr><th>편</th><th>업로드</th><th>조회수</th><th>클릭률</th><th>평균 시청시간</th><th>시청률</th></tr></thead>`;
      const tbody = document.createElement('tbody');
      g.videos.forEach(v => {
        const tr = document.createElement('tr');
        const priv = (v.privacy && v.privacy !== 'public') ? ' <span class="badge-priv">비공개</span>' : '';
        tr.innerHTML = `<td>${escapeHtml(v.part || v.title)}${priv}</td><td>${escapeHtml(v.pub || '')}</td><td class="num">${fmtNum(v.views)}</td><td class="num">${fmtPct(v.ctr)}</td><td class="num">${fmtDuration(v.avgViewDurationSec)}</td><td class="num">${fmtPct(v.avgViewPct)}</td>`;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      panel.appendChild(table);
      card.appendChild(panel);

      header.addEventListener('click', () => {
        const open = panel.hidden;
        panel.hidden = !open;
        header.setAttribute('aria-expanded', String(open));
        card.classList.toggle('open', open);
      });
    } else {
      header.classList.add('no-detail');
      chevron.hidden = true;
    }

    listEl.appendChild(card);
  });

  // 업로드 예정 섹션
  const pending = current.pending || [];
  if (pending.length) {
    const head = document.createElement('h2');
    head.className = 'section-head';
    head.textContent = `업로드 예정 (${pending.length}명)`;
    listEl.appendChild(head);

    const card = document.createElement('div');
    card.className = 'guest-card';
    const table = document.createElement('table');
    table.className = 'video-table';
    table.innerHTML = `<thead><tr><th>게스트</th><th>일정</th><th>상태</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    pending.forEach(p => {
      const tr = document.createElement('tr');
      const d = p.eventDate ? new Date(p.eventDate).toLocaleDateString('ko-KR') : '';
      tr.innerHTML = `<td>${escapeHtml(p.name)}</td><td>${escapeHtml(d)}</td><td>${escapeHtml(p.note || '')}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
    listEl.appendChild(card);
  }
}

// 당월 평균 대비 성과 구간을 색으로 구분해요.
//  +50% 이상 파랑 / +20% 이상 초록 / -20% 이하 노랑 / -50% 이하 빨강 / 그 사이는 기본색
//  표시는 소수점 첫째 자리까지, 색상 판정은 정수로 반올림한 값 기준이에요.
function perfLevel(value, avg) {
  if (typeof value !== 'number' || typeof avg !== 'number' || !avg) return { cls: null, sub: null };
  const exact = (value / avg - 1) * 100;
  const shown = exact.toFixed(1);
  const sub = `평균 대비 ${exact > 0 ? '+' : ''}${shown}%`;
  const pct = Math.round(exact);   // 색상은 반올림한 정수 기준
  if (pct >= 50) return { cls: 'perf-high', sub };
  if (pct >= 20) return { cls: 'perf-good', sub };
  if (pct <= -50) return { cls: 'perf-bad', sub };
  if (pct <= -20) return { cls: 'perf-warn', sub };
  return { cls: null, sub };
}

function statTile(label, value, sub) {
  const tile = document.createElement('div');
  tile.className = 'stat-tile';
  tile.innerHTML = `<div class="stat-label">${label}</div><div class="stat-value">${value}</div>`
    + (sub ? `<div class="stat-sub">${sub}</div>` : '');
  return tile;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ---------------- 관리자: 구글 API에서 실제 데이터 가져오기 ----------------

async function authFetch(url) {
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (res.status === 401) {
    // 토큰이 만료됐어요. 저장된 토큰을 지우고 다시 로그인하도록 안내해요.
    sessionStorage.removeItem('gToken');
    accessToken = null;
    throw new Error('로그인이 만료됐어요. "나가기" 후 다시 Google 로그인해주세요.');
  }
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`${url} -> ${res.status} ${body}`);
  }
  return res.json();
}

function monthKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthLabel(d) {
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
}

// 게스트 이름에서 직함을 떼어 핵심 인명만 남김 (영상 제목 매칭용)
function coreName(name) {
  return name.replace(TITLE_SUFFIX_RE, '').trim();
}

async function fetchCalendarGuestEvents() {
  const now = new Date();
  const timeMin = new Date(now.getFullYear(), 0, 1).toISOString();
  const timeMax = new Date(now.getFullYear() + 1, 0, 1).toISOString();
  let items = [];
  let pageToken = '';
  do {
    const qs = new URLSearchParams({
      timeMin, timeMax, singleEvents: 'true', orderBy: 'startTime', maxResults: '2500'
    });
    if (pageToken) qs.set('pageToken', pageToken);
    const data = await authFetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?${qs}`);
    items = items.concat(data.items || []);
    pageToken = data.nextPageToken || '';
  } while (pageToken);

  return items
    .filter(ev => ev.summary && ev.summary.includes(CALENDAR_PREFIX))
    .map(ev => {
      // "[성준] 이명찬 박사 (교양)" -> "이명찬 박사"
      const name = ev.summary.replace(CALENDAR_PREFIX, '').trim().replace(/\s*\([^)]*\)\s*$/, '').trim();
      const dateStr = ev.start.dateTime || ev.start.date;
      return { name, core: coreName(name), date: new Date(dateStr) };
    })
    .sort((a, b) => a.date - b.date);
}

async function fetchUploadsPlaylistId() {
  const data = await authFetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${YOUTUBE_CHANNEL_ID}`);
  const ch = data.items && data.items[0];
  if (!ch) throw new Error('채널을 찾을 수 없어요.');
  return ch.contentDetails.relatedPlaylists.uploads;
}

async function fetchAllUploads(uploadsPlaylistId, earliestNeeded) {
  let items = [];
  let pageToken = '';
  let pages = 0;
  do {
    // status를 함께 받아 비공개/미등재 영상도 알 수 있게 해요 (업로드 재생목록에는 포함돼요).
    const qs = new URLSearchParams({ part: 'snippet,status', maxResults: '50', playlistId: uploadsPlaylistId });
    if (pageToken) qs.set('pageToken', pageToken);
    const data = await authFetch(`https://www.googleapis.com/youtube/v3/playlistItems?${qs}`);
    const pageItems = (data.items || []).map(i => ({
      videoId: i.snippet.resourceId.videoId,
      privacy: i.status && i.status.privacyStatus,
      title: i.snippet.title,
      publishedAt: new Date(i.snippet.publishedAt)
    }));
    items = items.concat(pageItems);
    pageToken = data.nextPageToken || '';
    pages++;
    const oldestOnPage = pageItems.length ? pageItems[pageItems.length - 1].publishedAt : null;
    if (oldestOnPage && oldestOnPage < earliestNeeded) break;
  } while (pageToken && pages < 40);

  // 업로드 재생목록은 공개 영상만 담고 있어요 (편집자 권한이라 비공개는 빠짐).
  // 비공개 영상은 Analytics에는 남아 있으니, 거기서 ID를 긁어와 제목을 붙여 보강해요.
  const extra = await fetchNonPublicUploads(items, earliestNeeded);
  return items.concat(extra);
}

// Analytics에는 비공개 영상도 집계되므로, 업로드 목록에 없는 영상 ID를 찾아 되살려요.
async function fetchNonPublicUploads(publicItems, earliestNeeded) {
  try {
    const known = new Set(publicItems.map(v => v.videoId));
    const fmt = d => d.toISOString().slice(0, 10);
    const qs = new URLSearchParams({
      ids: `channel==${YOUTUBE_CHANNEL_ID}`,
      startDate: fmt(earliestNeeded),
      endDate: new Date().toISOString().slice(0, 10),
      metrics: 'views', dimensions: 'video', sort: '-views', maxResults: '200'
    });
    const data = await authFetch(`https://youtubeanalytics.googleapis.com/v2/reports?${qs}`);
    const unknownIds = (data.rows || []).map(r => r[0]).filter(id => !known.has(id));
    if (!unknownIds.length) return [];

    const out = [];
    for (let i = 0; i < unknownIds.length; i += 50) {
      const batch = unknownIds.slice(i, i + 50);
      const v = await authFetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=${batch.join(',')}`);
      (v.items || []).forEach(it => {
        // 이 채널의 영상이고, 필요한 기간 안에 올라간 것만
        if (it.snippet.channelId !== YOUTUBE_CHANNEL_ID) return;
        const pub = new Date(it.snippet.publishedAt);
        if (pub < earliestNeeded) return;
        out.push({
          videoId: it.id,
          privacy: it.status && it.status.privacyStatus,
          title: it.snippet.title,
          publishedAt: pub
        });
      });
    }
    return out;
  } catch (err) {
    console.warn('비공개 영상 보강 실패:', err.message);
    return [];
  }
}

// 조회수는 Data API의 실시간 누적값을 씁니다.
// (Analytics API의 views는 2~3일 지연되어 최근 업로드분이 크게 과소 집계돼요.)
async function fetchViewCounts(videoIds) {
  const result = {};
  for (let i = 0; i < videoIds.length; i += 50) {
    const batch = videoIds.slice(i, i + 50);
    const data = await authFetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${batch.join(',')}`);
    (data.items || []).forEach(it => {
      result[it.id] = Number(it.statistics.viewCount);
    });
  }
  return result;
}

// 시청 지속시간·시청률은 Analytics API에서만 제공돼요 (2~3일 지연 있음).
// 클릭률(노출 클릭률)은 Analytics API에 아예 없고 Reporting API(대량 CSV)로만 제공돼요.
async function fetchAnalyticsForVideos(videoIds) {
  if (!videoIds.length) return {};
  const result = {};
  for (let i = 0; i < videoIds.length; i += 50) {
    const batch = videoIds.slice(i, i + 50);
    const qs = new URLSearchParams({
      ids: `channel==${YOUTUBE_CHANNEL_ID}`,
      startDate: '2005-01-01',
      endDate: new Date().toISOString().slice(0, 10),
      metrics: 'averageViewDuration,averageViewPercentage',
      dimensions: 'video',
      filters: `video==${batch.join(',')}`,
      maxResults: '200'
    });
    const data = await authFetch(`https://youtubeanalytics.googleapis.com/v2/reports?${qs}`);
    (data.rows || []).forEach(row => {
      const [videoId, avgViewDuration, avgViewPct] = row;
      result[videoId] = { avgViewDurationSec: avgViewDuration, avgViewPct };
    });
  }
  return result;
}

// 클릭률: Reporting API(channel_reach_basic_a1)의 최신 CSV에서 영상별 CTR을 읽어와요.
// 리포트 작업이 아직 생성 중이면 조용히 빈 값을 돌려주고, 대시보드는 '–'로 표시돼요.
async function fetchCtrByVideo() {
  try {
    const jobsRes = await authFetch('https://youtubereporting.googleapis.com/v1/jobs');
    const job = (jobsRes.jobs || []).find(j => j.reportTypeId === REACH_REPORT_TYPE);
    if (!job) return {};
    const repRes = await authFetch(`https://youtubereporting.googleapis.com/v1/jobs/${job.id}/reports`);
    const reports = repRes.reports || [];
    if (!reports.length) return {};
    // 최신 리포트부터 최대 40개를 합산 (일별 파일이므로 노출·클릭을 누적해 가중 평균 CTR을 계산)
    const recent = reports.sort((a, b) => (b.startTime || '').localeCompare(a.startTime || '')).slice(0, 40);
    const acc = {};
    for (const rep of recent) {
      const res = await fetch(rep.downloadUrl, { headers: { Authorization: `Bearer ${accessToken}` } });
      if (!res.ok) continue;
      const text = await res.text();
      const lines = text.trim().split('\n');
      if (lines.length < 2) continue;
      const head = lines[0].split(',');
      const iVid = head.indexOf('video_id');
      const iImp = head.indexOf('video_thumbnail_impressions');
      const iCtr = head.indexOf('video_thumbnail_impressions_ctr');
      if (iVid < 0 || iImp < 0 || iCtr < 0) continue;
      for (let k = 1; k < lines.length; k++) {
        const c = lines[k].split(',');
        const vid = c[iVid];
        const imp = Number(c[iImp]);
        const ctr = Number(c[iCtr]);
        if (!vid || !isFinite(imp) || !isFinite(ctr)) continue;
        if (!acc[vid]) acc[vid] = { imp: 0, clicks: 0 };
        acc[vid].imp += imp;
        acc[vid].clicks += imp * ctr; // ctr은 비율(0~1 또는 0~100) — 아래에서 정규화
      }
    }
    const out = {};
    Object.entries(acc).forEach(([vid, a]) => {
      if (!a.imp) return;
      let pct = (a.clicks / a.imp);
      if (pct <= 1) pct = pct * 100; // 0~1 비율이면 퍼센트로 변환
      out[vid] = +pct.toFixed(2);
    });
    return out;
  } catch (err) {
    console.warn('클릭률 리포트를 아직 가져올 수 없어요:', err.message);
    return {};
  }
}

// ---------------- 저장소 채널 수집 ----------------

// 채널 이름으로 채널 ID를 찾아요 (내 계정의 채널이므로 검색으로 찾습니다).
async function resolveArchiveChannelId(name) {
  const qs = new URLSearchParams({ part: 'snippet', type: 'channel', q: name, maxResults: '10' });
  const d = await authFetch(`https://www.googleapis.com/youtube/v3/search?${qs}`);
  const exact = (d.items || []).find(i => i.snippet.title.trim() === name);
  const loose = (d.items || []).find(i => i.snippet.title.includes(name.split('_').pop()));
  const hit = exact || loose;
  return hit ? (hit.snippet.channelId || hit.id.channelId) : null;
}

// 제목으로 유형을 구분해요: "통합본"이 들어가면 통합본, 1~N부만 있으면 라이브.
function archiveGroupOf(title) {
  if (title.includes('통합본')) return '통합본';
  if (/\d+\s*부/.test(title)) return '라이브';
  return null;   // 그 외(쇼츠·예고 등)는 집계에서 제외
}

async function collectArchiveChannel(entry, ctrMapAll) {
  const channelId = entry.channelId || await resolveArchiveChannelId(entry.name);
  if (!channelId) return { key: entry.key, name: entry.name, channelId: null, months: [], error: '채널을 찾지 못했어요' };

  const chData = await authFetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channelId}`);
  const ch = chData.items && chData.items[0];
  if (!ch) return { key: entry.key, name: entry.name, channelId, months: [], error: '채널 정보를 못 읽었어요' };
  const uploads = ch.contentDetails.relatedPlaylists.uploads;

  // 업로드 전체 수집 (최대 1000개)
  let vids = [], pt = '', pages = 0;
  do {
    const qs = new URLSearchParams({ part: 'snippet', maxResults: '50', playlistId: uploads });
    if (pt) qs.set('pageToken', pt);
    const d = await authFetch(`https://www.googleapis.com/youtube/v3/playlistItems?${qs}`);
    (d.items || []).forEach(i => vids.push({
      videoId: i.snippet.resourceId.videoId,
      title: i.snippet.title,
      publishedAt: new Date(i.snippet.publishedAt)
    }));
    pt = d.nextPageToken || '';
    pages++;
  } while (pt && pages < 20);

  const ids = vids.map(v => v.videoId);
  const views = await fetchViewCounts(ids);
  const an = await fetchArchiveAnalytics(channelId, ids);

  // 월별 · 유형별 집계
  const byMonth = new Map();
  vids.forEach(v => {
    const group = archiveGroupOf(v.title);
    if (!group) return;
    const key = monthKey(v.publishedAt);
    if (!byMonth.has(key)) byMonth.set(key, { month: key, label: monthLabel(v.publishedAt), items: [] });
    byMonth.get(key).items.push({
      group,
      views: views[v.videoId] ?? null,
      ctr: ctrMapAll[v.videoId] ?? null,
      dur: (an[v.videoId] || {}).dur ?? null
    });
  });

  const avg = (arr, k) => {
    const q = arr.map(x => x[k]).filter(x => typeof x === 'number');
    return q.length ? q.reduce((a, b) => a + b, 0) / q.length : null;
  };
  const months = [...byMonth.values()].map(m => {
    const groups = {};
    ARCHIVE_GROUPS.forEach(g => {
      const arr = m.items.filter(x => x.group === g);
      if (!arr.length) return;
      const c = avg(arr, 'ctr'), d = avg(arr, 'dur'), vv = avg(arr, 'views');
      groups[g] = {
        videoCount: arr.length,
        avgViews: vv == null ? null : Math.round(vv),
        avgCtr: c == null ? null : +c.toFixed(2),
        avgViewDurationSec: d == null ? null : Math.round(d)
      };
    });
    const c = avg(m.items, 'ctr'), d = avg(m.items, 'dur'), vv = avg(m.items, 'views');
    return {
      month: m.month, label: m.label, videoCount: m.items.length,
      avgViews: vv == null ? null : Math.round(vv),
      avgCtr: c == null ? null : +c.toFixed(2),
      avgViewDurationSec: d == null ? null : Math.round(d),
      groups
    };
  }).sort((a, b) => a.month.localeCompare(b.month));

  return { key: entry.key, name: entry.name, channelId, months };
}

// 저장소 채널의 시청 지속시간 (채널별로 ids 파라미터가 달라요)
async function fetchArchiveAnalytics(channelId, videoIds) {
  const result = {};
  for (let i = 0; i < videoIds.length; i += 50) {
    const batch = videoIds.slice(i, i + 50);
    const qs = new URLSearchParams({
      ids: `channel==${channelId}`,
      startDate: '2005-01-01',
      endDate: new Date().toISOString().slice(0, 10),
      metrics: 'averageViewDuration',
      dimensions: 'video',
      filters: `video==${batch.join(',')}`,
      maxResults: '200'
    });
    try {
      const d = await authFetch(`https://youtubeanalytics.googleapis.com/v2/reports?${qs}`);
      (d.rows || []).forEach(r => { result[r[0]] = { dur: r[1] }; });
    } catch (err) {
      console.warn('저장소 시청 지표를 못 가져왔어요:', err.message);
      break;
    }
  }
  return result;
}

async function runAdminSync() {
  $('sync-status').hidden = false;
  $('sync-status').textContent = '캘린더에서 게스트 목록을 가져오는 중...';
  $('sync-btn').disabled = true;
  try {
    const events = await fetchCalendarGuestEvents();
    if (!events.length) {
      $('sync-status').textContent = `"${CALENDAR_PREFIX}"로 시작하는 일정을 찾지 못했어요.`;
      return;
    }

    $('sync-status').textContent = '유튜브 업로드 목록을 가져오는 중...';
    const uploadsId = await fetchUploadsPlaylistId();
    const earliestNeeded = new Date(Math.min(...events.map(e => e.date.getTime())) - 7 * 86400000);
    const allVideos = await fetchAllUploads(uploadsId, earliestNeeded);

    $('sync-status').textContent = '게스트별 영상 세트를 매칭하는 중...';
    // 녹화일(캘린더 일정) 기준으로 그 게스트의 세트를 묶어요.
    // 규칙: 제목에 "특집" 있으면 제외 / 편 라벨(1~5부, 풀버전)만 인정 /
    //       풀버전 + 3편 이상이어야 집계 (1·2부+풀버전은 라이브 편집본이므로 제외) /
    //       이미 다른 회차에 배정된 영상은 재사용하지 않음
    const used = new Set();
    const sets = events.map(ev => {
      const start = ev.date;
      const end = new Date(start.getTime() + SET_WINDOW_DAYS * 86400000);
      const cand = allVideos
        .filter(v => !used.has(v.videoId)
          && v.title.includes(ev.core)
          && !v.title.includes(EXCLUDE_KEYWORD)
          && v.publishedAt >= start && v.publishedAt <= end)
        .sort((a, b) => a.publishedAt - b.publishedAt);

      const picked = [];
      const parts = new Set();
      cand.forEach(v => {
        const m = v.title.match(/([1-5])부/);
        const key = m ? m[1] : (v.title.includes('풀버전') ? 'full' : null);
        if (key && !parts.has(key)) {
          parts.add(key);
          picked.push({ videoId: v.videoId, title: v.title, privacy: v.privacy, part: key === 'full' ? '풀버전' : key + '부', pub: v.publishedAt.toISOString().slice(0, 10) });
        }
      });
      const numParts = [...parts].filter(k => k !== 'full').length;
      const ok = parts.has('full') && numParts >= MIN_PARTS;
      if (ok) picked.forEach(p => used.add(p.videoId));
      return { ...ev, picked, hasFull: parts.has('full'), numParts, ok };
    });

    $('sync-status').textContent = 'YouTube 조회수·시청 지표를 가져오는 중...';
    const neededIds = [...new Set(sets.filter(s => s.ok).flatMap(s => s.picked.map(p => p.videoId)))];
    const viewCounts = await fetchViewCounts(neededIds);
    const analytics = await fetchAnalyticsForVideos(neededIds);

    $('sync-status').textContent = '클릭률 리포트를 확인하는 중...';
    const ctrMap = await fetchCtrByVideo();

    const monthsMap = new Map();
    sets.forEach(s => {
      const key = monthKey(s.date);
      if (!monthsMap.has(key)) monthsMap.set(key, { month: key, label: monthLabel(s.date), guests: [], pending: [] });
      const entry = monthsMap.get(key);

      if (!s.ok) {
        entry.pending.push({
          name: s.name,
          eventDate: s.date.toISOString().slice(0, 10),
          uploaded: s.picked.length,
          note: (s.hasFull && s.numParts === 2) ? '라이브 편집본만 업로드됨'
              : (s.picked.length ? `일부만 업로드됨 (${s.picked.length}편)` : '미업로드')
        });
        return;
      }

      const videos = s.picked.map(p => {
        const a = analytics[p.videoId] || {};
        return {
          part: p.part, pub: p.pub,
          privacy: p.privacy || null,
          views: viewCounts[p.videoId] ?? null,
          ctr: ctrMap[p.videoId] ?? null,
          avgViewDurationSec: a.avgViewDurationSec ?? null,
          avgViewPct: a.avgViewPct ?? null
        };
      }).sort((a, b) => partOrder(a.part) - partOrder(b.part));

      const n = videos.length || 1;
      const avg = (key2) => {
        const vals = videos.map(v => v[key2]).filter(x => typeof x === 'number');
        return vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : null;
      };
      const totalViews = videos.reduce((x, v) => x + (v.views || 0), 0);
      const avgCtr = avg('ctr');
      const avgDur = avg('avgViewDurationSec');
      const avgPct = avg('avgViewPct');

      entry.guests.push({
        name: s.name,
        eventDate: s.date.toISOString().slice(0, 10),
        videoCount: n,
        totalViews,
        avgViews: Math.round(totalViews / n),
        avgCtr: avgCtr == null ? null : +avgCtr.toFixed(2),
        avgViewDurationSec: avgDur == null ? null : Math.round(avgDur),
        avgViewPct: avgPct == null ? null : +avgPct.toFixed(2),
        videos
      });
    });

    const months = Array.from(monthsMap.values()).sort((a, b) => a.month.localeCompare(b.month));
    months.forEach(m => {
      m.guests.sort((a, b) => a.eventDate.localeCompare(b.eventDate));
      m.pending.sort((a, b) => a.eventDate.localeCompare(b.eventDate));
    });
    // 저장소 채널 수집
    $('sync-status').textContent = '저장소 채널(투자/교양/부동산)을 가져오는 중...';
    const archiveChannels = [];
    for (const entry of ARCHIVE_CHANNELS) {
      try {
        $('sync-status').textContent = `저장소 「${entry.key}」 수집 중...`;
        archiveChannels.push(await collectArchiveChannel(entry, ctrMap));
      } catch (err) {
        console.warn(`저장소 ${entry.key} 실패:`, err.message);
        archiveChannels.push({ key: entry.key, name: entry.name, months: [], error: err.message });
      }
    }

    publishedData = {
      updatedAt: new Date().toISOString(),
      channel: '웅달 책방',
      months,
      archive: { channels: archiveChannels }
    };
    activeMonth = months.length ? months[months.length - 1].month : null;
    render();
    const ctrCount = Object.keys(ctrMap).length;
    const archOk = archiveChannels.filter(c => c.months && c.months.length).length;
    $('sync-status').textContent = `완료! 저장소 ${archOk}/${ARCHIVE_CHANNELS.length}개 채널 · 클릭률 ${ctrCount ? ctrCount + '개 영상 반영' : '아직 리포트 생성 전(등록 후 1~2일 소요)'} — 이제 "게시하기"를 눌러야 다른 사람들에게 반영돼요.`;
  } catch (err) {
    console.error(err);
    $('sync-status').textContent = '오류가 발생했어요: ' + err.message;
  } finally {
    $('sync-btn').disabled = false;
  }
}

$('sync-btn').addEventListener('click', runAdminSync);

// ---------------- 관리자: GitHub에 게시 ----------------

async function publishToGithub() {
  if (!publishedData) return;
  let pat = localStorage.getItem('gh_pat');
  if (!pat) {
    pat = prompt('GitHub Personal Access Token을 입력하세요 (repo 쓰기 권한 필요, 이 브라우저에만 저장돼요):');
    if (!pat) return;
    localStorage.setItem('gh_pat', pat);
  }
  $('sync-status').hidden = false;
  $('sync-status').textContent = 'GitHub에 게시하는 중...';
  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;
    let sha = undefined;
    const getRes = await fetch(apiUrl, { headers: { Authorization: `Bearer ${pat}` } });
    if (getRes.ok) {
      const getData = await getRes.json();
      sha = getData.sha;
    } else if (getRes.status !== 404) {
      throw new Error(`파일 조회 실패: ${getRes.status}`);
    }
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(publishedData, null, 2))));
    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${pat}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: '대시보드 데이터 업데이트', content, sha, branch: 'main' })
    });
    if (!putRes.ok) {
      const body = await putRes.text().catch(() => '');
      if (putRes.status === 401) { localStorage.removeItem('gh_pat'); }
      throw new Error(`게시 실패: ${putRes.status} ${body}`);
    }
    $('sync-status').textContent = '게시 완료! 몇 분 안에 모두에게 반영돼요.';
  } catch (err) {
    console.error(err);
    $('sync-status').textContent = '게시 중 오류: ' + err.message;
  }
}

$('publish-btn').addEventListener('click', publishToGithub);

// 게스트 이름을 비교용 키로 정규화해요.
// "이명찬 박사님" / "이명찬 박사" / "이명찬" → 모두 "이명찬"
// 뒤에 붙은 (2차) 같은 표기와 공백도 제거해서 월 간 매칭이 되게 합니다.
function guestKey(name) {
  return String(name || '')
    .replace(/\s*\([^)]*\)\s*$/, '')   // 끝의 (2차) 등 제거
    .replace(/님\s*$/, '')             // 존칭 '님' 제거 (교수님 → 교수)
    .replace(TITLE_SUFFIX_RE, '')      // 직함 제거 (박사/교수/대표 …)
    .replace(/\s+/g, '')               // 공백 제거
    .trim();
}

const GRADE_ORDER = { D: 0, C: 1, B: 2, A: 3, S: 4 };

// 두 이름이 같은 인물인지 판단해요.
// 별칭이 앞에 붙는 경우가 있어서("부자아빠 정재호 대표" ↔ "정재호 대표"),
// 한쪽이 다른 쪽으로 끝나거나 이름 3글자가 겹치면 같은 인물로 봅니다.
function sameGuest(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  if (a.length >= 2 && b.length >= 2 && (a.endsWith(b) || b.endsWith(a))) return true;
  const share3 = (x, y) => {
    for (let i = 0; i + 3 <= x.length; i++) if (y.includes(x.slice(i, i + 3))) return true;
    return false;
  };
  return share3(a, b) || share3(b, a);
}

// 직전 달에서 같은 인물을 찾아 등급 변화를 계산해요.
function gradeChange(guest, prevMonth) {
  if (!prevMonth || !prevMonth.guests || !prevMonth.guests.length) return null;
  const key = guestKey(guest.name);
  if (!key) return null;
  const matches = prevMonth.guests.filter(g => isComplete(g) && sameGuest(key, guestKey(g.name)));
  if (!matches.length) return null;
  // 같은 달에 여러 번 출연했다면 가장 최근 회차를 기준으로 비교해요.
  const prev = matches.slice().sort((a, b) => String(a.eventDate).localeCompare(String(b.eventDate))).pop();
  const from = gradeOf(prev.totalViews);
  const to = gradeOf(guest.totalViews);
  if (!from || !to) return null;
  const diff = (GRADE_ORDER[to] ?? 0) - (GRADE_ORDER[from] ?? 0);
  return { from, to, diff, prevName: prev.name, prevViews: prev.totalViews, prevLabel: prevMonth.label };
}

// 같은 게스트의 바로 앞 출연 회차를 찾아요 (같은 달의 이전 회차 → 이전 달들 순으로 역순 탐색).
function findPrevAppearance(guest, months, curIdx) {
  const key = guestKey(guest.name);
  if (!key) return null;
  for (let i = curIdx; i >= 0; i--) {
    const m = months[i];
    if (!m || !m.guests) continue;
    const cands = m.guests.filter(g => isComplete(g) && sameGuest(key, guestKey(g.name))
      && String(g.eventDate) < String(guest.eventDate));
    if (cands.length) {
      const prev = cands.slice().sort((a, b) => String(a.eventDate).localeCompare(String(b.eventDate))).pop();
      return { guest: prev, label: m.label };
    }
  }
  return null;
}

// 세트가 다 올라왔는지 (풀버전 + 3편 이상).
// 1부만 올라와도 화면에는 바로 나오지만, 평균·랭킹 같은 비교 지표는 완성된 세트만 씁니다.
// 예전에 저장된 데이터에는 이 값이 없어서 완료로 봐요.
function isComplete(g) { return !g || g.complete !== false; }

// 총 조회수 절대 기준 등급 (월 평균과 무관)
//  20만 이상 S / 15만~ A / 10만~ B / 8만 초과~ C / 8만 이하 D
function gradeOf(totalViews) {
  if (typeof totalViews !== 'number') return null;
  if (totalViews >= 200000) return 'S';
  if (totalViews >= 150000) return 'A';
  if (totalViews >= 100000) return 'B';
  if (totalViews > 80000) return 'C';
  return 'D';
}

// 당월 평균 대비 성과 구간을 색으로 구분해요.
//  +50% 이상 파랑 / +20% 이상 초록 / -20% 이하 노랑 / -50% 이하 빨강 / 그 사이는 기본색
//  표시는 소수점 첫째 자리까지, 색상 판정은 정수로 반올림한 값 기준이에요.
function perfLevel(value, avg) {
  if (typeof value !== 'number' || typeof avg !== 'number' || !avg) return { cls: null, sub: null };
  const exact = (value / avg - 1) * 100;
  const shown = exact.toFixed(1);
  const sub = `평균 대비 ${exact > 0 ? '+' : ''}${shown}%`;
  const pct = Math.round(exact);   // 색상은 반올림한 정수 기준
  if (pct >= 50) return { cls: 'perf-high', sub };
  if (pct >= 20) return { cls: 'perf-good', sub };
  if (pct <= -50) return { cls: 'perf-bad', sub };
  if (pct <= -20) return { cls: 'perf-warn', sub };
  return { cls: null, sub };
}

// 타일 아래에 '전월 대비 +N (+x%)' 줄을 붙여요. 비교 대상이 없으면 안내만 남깁니다.
function appendDelta(tile, cur, prev, prevLabel) {
  const line = document.createElement('div');
  line.className = 'stat-sub';
  if (typeof cur !== 'number' || typeof prev !== 'number' || !prev) {
    line.style.color = 'var(--muted)';
    line.textContent = '전월 비교 없음';
  } else {
    const diff = cur - prev;
    const pct = (diff / prev) * 100;
    const sign = diff > 0 ? '+' : (diff < 0 ? '−' : '±');
    line.className = 'stat-sub ' + (diff > 0 ? 'chg-up' : (diff < 0 ? 'chg-down' : 'chg-same'));
    line.textContent = `전월 대비 ${sign}${fmtNum(Math.abs(diff))} (${diff > 0 ? '+' : (diff < 0 ? '−' : '')}${Math.abs(pct).toFixed(1)}%)`;
    line.title = `${prevLabel || '직전 달'} ${fmtNum(prev)} → 이번 달 ${fmtNum(cur)}`;
  }
  tile.appendChild(line);
  return tile;
}

function statTile(label, value, sub) {
  const tile = document.createElement('div');
  tile.className = 'stat-tile';
  tile.innerHTML = `<div class="stat-label">${label}</div><div class="stat-value">${value}</div>`
    + (sub ? `<div class="stat-sub">${sub}</div>` : '');
  return tile;
}

// 화면 하단에 크게 알림을 띄워요.
// 시청 지표 수집이 실패하면 조용히 넘어가지 않고 화면에 빨간 알림을 띄워요.
// (예전에는 실패해도 빈 값으로 덮어써서 지표가 사라졌습니다.)
function analyticsFailure(failed, total, msg) {
  if (!failed) return;
  const text = `\u26a0 시청 지표(유효 조회수·시청률)를 못 받았어요 — ${failed}/${total} 요청 실패 (${String(msg).slice(0, 100)}). 기존 값은 그대로 뒀습니다.`;
  showToast(text, false);
  const el = $('sync-status');
  if (el) { el.hidden = false; el.style.color = 'var(--critical)'; el.textContent = text; }
}

function showToast(msg, ok = true) {
  const el = $('toast');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'bad';
  el.hidden = false;                // 전환 효과 없이 바로 띄워요 (배경 탭에서도 확실히 보이도록)
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.hidden = true; }, 6000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ---------------- 관리자: 구글 API에서 실제 데이터 가져오기 ----------------

async function authFetch(url) {
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (res.status === 401) {
    // 토큰이 만료됐어요. 저장된 토큰을 지우고 다시 로그인하도록 안내해요.
    sessionStorage.removeItem('gToken');
    accessToken = null;
    throw new Error('로그인이 만료됐어요. "나가기" 후 다시 Google 로그인해주세요.');
  }
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`${url} -> ${res.status} ${body}`);
  }
  return res.json();
}

function monthKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthLabel(d) {
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
}

// 게스트 이름에서 직함을 떼어 핵심 인명만 남김 (영상 제목 매칭용)
// 제목에 게스트 이름이 들어있는지 확인해요.
// 캘린더와 제목의 띄어쓰기가 다른 경우가 있어("존 리" ↔ "존리") 공백을 지우고 비교합니다.
// 한글이 자모로 분리 저장된 경우(NFD)를 합쳐요 — "부"가 ᄇ+ᅮ로 들어오면 정규식이 안 먹혀요.
function nfc(str) {
  return String(str || '').normalize('NFC');
}

// 영상 설명란의 "8월 25일에 촬영되었습니다" 같은 문구에서 촬영일을 읽어요.
// 기입이 빠진 영상도 있어서, 있으면 우선 쓰고 없으면 기존 방식(업로드일 기준)으로 넘어갑니다.
// 촬영일 기입은 하루 정도 어긋나기도 하고 아예 빠지기도 해요.
// 그래서 "이 회차 것이 아니다"라고 단정할 때만 씁니다 —
// 촬영일이 같은 게스트의 '다른 일정' 날짜와 정확히 맞을 때만 배제해요.
function shootConflicts(shot, thisEvDate, otherEvDates) {
  if (!shot) return false;
  const k = d => new Date(d.getTime() + 9 * 3600000).toISOString().slice(0, 10);
  const sk = k(shot);
  if (Math.abs((shot - thisEvDate) / 86400000) <= 2) return false;   // 이 회차와 ±2일이면 같은 건으로 봐요
  return otherEvDates.some(d => k(d) === sk);
}

function shootDateFromDesc(desc, publishedAt) {
  if (!desc) return null;
  const t = nfc(desc);
  let m = t.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?\s*에?\s*촬영/);
  let y, mo, da;
  if (m) { y = +m[1]; mo = +m[2]; da = +m[3]; }
  else {
    m = t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일에?\s*촬영/);
    if (!m) return null;
    mo = +m[1]; da = +m[2];
    // 연도가 없으면 업로드 연도를 쓰되, 12월→1월처럼 해가 바뀐 경우를 보정해요.
    const pub = new Date(publishedAt);
    y = pub.getFullYear();
    if (mo === 12 && pub.getMonth() === 0) y -= 1;
  }
  if (!(mo >= 1 && mo <= 12 && da >= 1 && da <= 31)) return null;
  const d = new Date(Date.UTC(y, mo - 1, da, -9));
  // 업로드보다 미래이거나 60일 이상 과거면 잘못 읽은 것으로 보고 버립니다.
  const gap = (new Date(publishedAt) - d) / 86400000;
  if (gap < -1 || gap > 60) return null;
  return d;
}

function titleHasGuest(title, core) {
  if (!title || !core) return false;
  if (title.includes(core)) return true;
  const squash = str => String(str).replace(/\s+/g, '');
  return squash(title).includes(squash(core));
}

function coreName(name) {
  // "대표님", "소장님"처럼 뒤에 붙는 '님'을 먼저 떼어내요.
  const base = name.replace(AFFILIATION_RE, ' ').replace(/님\s*$/, '').trim();
  return base.replace(TITLE_SUFFIX_RE, '').trim();
}

async function fetchCalendarGuestEvents(prefix = CALENDAR_PREFIX) {
  const now = new Date();
  const timeMin = new Date(now.getFullYear(), 0, 1).toISOString();
  const timeMax = new Date(now.getFullYear() + 1, 0, 1).toISOString();
  let items = [];
  let pageToken = '';
  do {
    const qs = new URLSearchParams({
      timeMin, timeMax, singleEvents: 'true', orderBy: 'startTime', maxResults: '2500'
    });
    if (pageToken) qs.set('pageToken', pageToken);
    const data = await authFetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?${qs}`);
    items = items.concat(data.items || []);
    pageToken = data.nextPageToken || '';
  } while (pageToken);

  return items
    .filter(ev => ev.summary && ev.summary.includes(prefix))
    .map(ev => {
      // "[성준] 이명찬 박사 (교양)" -> "이명찬 박사"
      const raw = nfc(ev.summary);
      // 끝의 "(교양)" 같은 괄호가 주제 분류예요.
      const catMatch = raw.match(/\(([^)]*)\)\s*$/);
      const category = catMatch ? catMatch[1].trim() : null;
      const name = raw.replace(prefix, '').trim().replace(/\s*\([^)]*\)\s*$/, '').trim();
      const dateStr = ev.start.dateTime || ev.start.date;
      return { name, core: coreName(name), category, date: new Date(dateStr) };
    })
    .sort((a, b) => a.date - b.date);
}

async function fetchUploadsPlaylistId() {
  const data = await authFetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${YOUTUBE_CHANNEL_ID}`);
  const ch = data.items && data.items[0];
  if (!ch) throw new Error('채널을 찾을 수 없어요.');
  return ch.contentDetails.relatedPlaylists.uploads;
}

async function fetchAllUploads(uploadsPlaylistId, earliestNeeded) {
  let items = [];
  let pageToken = '';
  let pages = 0;
  do {
    // status를 함께 받아 비공개/미등재 영상도 알 수 있게 해요 (업로드 재생목록에는 포함돼요).
    const qs = new URLSearchParams({ part: 'snippet,status', maxResults: '50', playlistId: uploadsPlaylistId });
    if (pageToken) qs.set('pageToken', pageToken);
    const data = await authFetch(`https://www.googleapis.com/youtube/v3/playlistItems?${qs}`);
    const pageItems = (data.items || []).map(i => ({
      videoId: i.snippet.resourceId.videoId,
      privacy: i.status && i.status.privacyStatus,
      title: nfc(i.snippet.title),
      publishedAt: new Date(i.snippet.publishedAt)
    }));
    items = items.concat(pageItems);
    pageToken = data.nextPageToken || '';
    pages++;
    // 페이지 전체가 필요 기간보다 과거일 때만 멈춰요 (순서가 뒤섞인 항목 때문에 조기 종료 방지).
    if (pageItems.length && pageItems.every(v => v.publishedAt < earliestNeeded)) break;
  } while (pageToken && pages < 60);

  // 업로드 재생목록은 공개 영상만 담고 있어요 (편집자 권한이라 비공개는 빠짐).
  // 비공개 영상은 Analytics에는 남아 있으니, 거기서 ID를 긁어와 제목을 붙여 보강해요.
  const extra = await fetchNonPublicUploads(items, earliestNeeded);
  return items.concat(extra);
}

// Analytics에는 비공개 영상도 집계되므로, 업로드 목록에 없는 영상 ID를 찾아 되살려요.
async function fetchNonPublicUploads(publicItems, earliestNeeded) {
  try {
    const known = new Set(publicItems.map(v => v.videoId));
    const fmt = d => d.toISOString().slice(0, 10);
    // Analytics는 한 번에 200행까지만 주고 startIndex는 지원하지 않아요.
    // 비공개 영상은 조회수가 낮아 상위 200에 못 드니, 내림차순과 오름차순을 함께 조회해 합칩니다.
    const allIds = [];
    for (const order of ['-views', 'views']) {
      const qs = new URLSearchParams({
        ids: `channel==${YOUTUBE_CHANNEL_ID}`,
        startDate: fmt(earliestNeeded),
        endDate: new Date().toISOString().slice(0, 10),
        metrics: 'views', dimensions: 'video', sort: order, maxResults: '200'
      });
      const page = await authFetch(`https://youtubeanalytics.googleapis.com/v2/reports?${qs}`).catch(() => null);
      ((page && page.rows) || []).forEach(r => allIds.push(r[0]));
    }
    const unknownIds = [...new Set(allIds)].filter(id => !known.has(id));
    if (!unknownIds.length) return [];

    const out = [];
    for (let i = 0; i < unknownIds.length; i += 50) {
      const batch = unknownIds.slice(i, i + 50);
      const v = await authFetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=${batch.join(',')}`);
      (v.items || []).forEach(it => {
        // 이 채널의 영상이고, 필요한 기간 안에 올라간 것만
        if (it.snippet.channelId !== YOUTUBE_CHANNEL_ID) return;
        const pub = new Date(it.snippet.publishedAt);
        if (pub < earliestNeeded) return;
        out.push({
          videoId: it.id,
          privacy: it.status && it.status.privacyStatus,
          title: nfc(it.snippet.title),
          publishedAt: pub
        });
      });
    }
    return out;
  } catch (err) {
    console.warn('비공개 영상 보강 실패:', err.message);
    return [];
  }
}

// 조회수는 Data API의 실시간 누적값을 씁니다.
// (Analytics API의 views는 2~3일 지연되어 최근 업로드분이 크게 과소 집계돼요.)
// 영상 길이(초)를 가져와요 — 쇼츠를 걸러낼 때 씁니다.
async function fetchDurations(videoIds) {
  const out = {};
  const batches = [];
  for (let i = 0; i < videoIds.length; i += 50) batches.push(videoIds.slice(i, i + 50));
  const pages = await Promise.all(batches.map(b =>
    authFetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${b.join(',')}`).catch(() => null)));
  pages.forEach(data => {
    ((data && data.items) || []).forEach(it => {
      const m = (it.contentDetails.duration || '').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (m) out[it.id] = (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0));
    });
  });
  return out;
}

async function fetchViewCounts(videoIds) {
  const result = {};
  const batches = [];
  for (let i = 0; i < videoIds.length; i += 50) batches.push(videoIds.slice(i, i + 50));
  // 배치를 병렬로 요청해 대기 시간을 줄여요.
  const pages = await Promise.all(batches.map(b =>
    authFetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${b.join(',')}`).catch(() => null)));
  pages.forEach(data => {
    ((data && data.items) || []).forEach(it => { result[it.id] = Number(it.statistics.viewCount); });
  });
  return result;
}

// 시청 지속시간·시청률은 Analytics API에서만 제공돼요 (2~3일 지연 있음).
// 클릭률은 브라우저에서 받을 수 없어 다루지 않아요 (Analytics API에 없고, Reporting API CSV는 CORS로 차단됨).
async function fetchAnalyticsForVideos(videoIds) {
  if (!videoIds.length) return {};
  const result = {};
  const batches = [];
  for (let i = 0; i < videoIds.length; i += 50) batches.push(videoIds.slice(i, i + 50));
  const ask = (batch, metrics) => {
    const qs = new URLSearchParams({
      ids: `channel==${YOUTUBE_CHANNEL_ID}`,
      startDate: '2005-01-01',
      endDate: new Date().toISOString().slice(0, 10),
      metrics,
      dimensions: 'video',
      filters: `video==${batch.join(',')}`,
      maxResults: '200'
    });
    return authFetch(`https://youtubeanalytics.googleapis.com/v2/reports?${qs}`);
  };
  let failed = 0, lastErr = '';
  const pages = await Promise.all(batches.map(async batch => {
    try { return await ask(batch, ANALYTICS_METRICS); }
    catch (e1) {
      // 유효 조회수를 아직 못 주는 경우가 있어 기본 지표만으로 한 번 더 시도해요.
      try { return await ask(batch, ANALYTICS_METRICS_BASIC); }
      catch (e2) { failed++; lastErr = e2.message; return null; }
    }
  }));
  pages.forEach(data => {
    if (!data) return;
    // 열 순서를 가정하지 않고 columnHeaders로 짝지어요 (지표를 추가해도 안 깨지도록).
    const cols = (data.columnHeaders || []).map(c => c.name);
    (data.rows || []).forEach(row => {
      const o = {};
      cols.forEach((c, i) => { o[c] = row[i]; });
      result[o.video] = {
        avgViewDurationSec: typeof o.averageViewDuration === 'number' ? o.averageViewDuration : null,
        avgViewPct: typeof o.averageViewPercentage === 'number' ? o.averageViewPercentage : null,
        engagedViews: typeof o.engagedViews === 'number' ? o.engagedViews : null
      };
    });
  });
  analyticsFailure(failed, batches.length, lastErr);
  return result;
}


// 담당자 태그와 무관하게 캘린더 전체를 읽어요 (주제별 TOP은 팀 전원의 업로드가 대상).
async function fetchAllCalendarEvents() {
  const now = new Date();
  const timeMin = new Date(now.getFullYear(), 0, 1).toISOString();
  const timeMax = new Date(now.getFullYear() + 1, 0, 1).toISOString();
  let items = [], pageToken = '';
  do {
    const qs = new URLSearchParams({ timeMin, timeMax, singleEvents: 'true', orderBy: 'startTime', maxResults: '2500' });
    if (pageToken) qs.set('pageToken', pageToken);
    const d = await authFetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?${qs}`);
    items = items.concat(d.items || []);
    pageToken = d.nextPageToken || '';
  } while (pageToken);

  return items.map(ev => {
    const raw = nfc(ev.summary || '');
    const cm = raw.match(/\(([^)]*)\)\s*$/);
    const category = cm ? cm[1].trim() : null;
    const tagM = raw.match(/^\s*\[([^\]]*)\]/);
    const tag = tagM ? tagM[1].trim() : null;
    const name = raw.replace(/^\s*\[[^\]]*\]\s*/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
    const dateStr = (ev.start && (ev.start.dateTime || ev.start.date)) || null;
    return { name, core: coreName(name), category, tag, date: dateStr ? new Date(dateStr) : null };
  }).filter(e => e.date && e.core);
}

// 주제별 TOP 수집 — 최근 업로드분을 담당자 구분 없이 모아 분야별로 줄 세워요.
async function refreshTopics() {
  const events = await fetchAllCalendarEvents();
  const since = new Date(Date.now() - TOPIC_DAYS * 86400000);
  let vids = await fetchVideosInRange(YOUTUBE_CHANNEL_ID, since.toISOString(), new Date().toISOString());
  // [라이브] 일정에서 나온 영상은 여기서도 빼요.
  const liveIds = await liveClaimedIds(vids);
  vids = vids.filter(v => !liveIds.has(v.videoId));

  // 촬영일이 업로드보다 앞서므로, 업로드일 기준 최근 60일 안의 일정까지 후보로 봅니다.
  const evRecent = events.filter(e => e.date >= new Date(Date.now() - 60 * 86400000));
  let picked = [];
  vids.forEach(v => {
    // 편 라벨(1~5부)이 붙은 단일 영상만 대상으로 해요.
    // 라벨 없는 재편집·통합 영상, 풀버전, 특집은 제외합니다.
    if (!/\d+\s*부/.test(v.title)) return;
    if (v.title.includes('풀버전')) return;
    if (v.title.includes(EXCLUDE_KEYWORD)) return;
    // 설명란 촬영일이 있으면 그 날짜 일정을 먼저 쓰고, 없으면 업로드 앞의 가장 가까운 일정을 골라요.
    let ev = null;
    const shot = shootDateFromDesc(v.desc, v.publishedAt);
    if (shot) {
      let g = Infinity;
      evRecent.forEach(e => {
        if (!titleHasGuest(v.title, e.core)) return;
        const diff = Math.abs((shot - e.date) / 86400000);
        if (diff <= 2 && diff < g) { g = diff; ev = e; }
      });
    }
    if (!ev) {
      let best = Infinity;
      evRecent.forEach(e => {
        if (!titleHasGuest(v.title, e.core)) return;
        const gap = v.publishedAt - e.date;
        if (gap < 0) return;
        const days = gap / 86400000;
        if (days > SET_WINDOW_DAYS) return;
        if (days < best) { best = days; ev = e; }
      });
    }
    if (!ev) return;
    if (ev.tag === '라이브') return;      // 캘린더에 [라이브]로 적힌 건 제외
    picked.push({ videoId: v.videoId, title: v.title, guest: ev.name, category: ev.category,
                  tag: ev.tag, setKey: ev.core + '|' + ev.date.toISOString().slice(0, 10),
                  pub: v.publishedAt.toISOString().slice(0, 10) });
  });

  // 쇼츠(3분 미만)는 빼요.
  const durs = await fetchDurations(picked.map(p => p.videoId));
  picked = picked.filter(p => {
    const d = durs[p.videoId];
    return typeof d !== 'number' || d >= 180;
  });

  const views = await fetchViewCounts(picked.map(p => p.videoId));
  const cats = {};
  TOPIC_CATS.forEach(c => { cats[c] = []; });
  const mine = [];
  const myTag = CALENDAR_PREFIX.replace(/[\[\]]/g, '');
  picked.forEach(p => {
    const n = views[p.videoId];
    if (typeof n !== 'number' || n <= TOPIC_MIN_VIEWS) return;
    const row = { title: p.title, views: n, guest: p.guest, pub: p.pub };
    if (TOPIC_CATS.includes(p.category)) cats[p.category].push(row);
    // 내 담당분은 주제와 무관하게 따로 모아요.
    if (p.tag === myTag) mine.push({ ...row, category: p.category || null });
  });
  TOPIC_CATS.forEach(c => {
    cats[c] = cats[c].sort((a, b) => b.views - a.views).slice(0, 10);
  });
  const myTop = mine.sort((a, b) => b.views - a.views).slice(0, 10);

  publishedData.topics = { days: TOPIC_DAYS, minViews: TOPIC_MIN_VIEWS, cats, mine: myTop, updatedAt: new Date().toISOString() };
  publishedData.updatedAt = new Date().toISOString();
}

// [라이브] 일정이 만들어낸 영상을 골라내요.
//  규칙: 캘린더 날짜 다음날 1부 → 그 다음날 2부 → 그 다음날 풀버전 (고정 패턴).
//  하루 정도 밀리는 경우가 있어 +1~+5일까지 허용합니다.
let _liveCache = null;
async function liveEvents() {
  if (!_liveCache) {
    _liveCache = (await fetchAllCalendarEvents()).filter(e => e.tag === '라이브');
  }
  return _liveCache;
}

async function liveClaimedIds(vids) {
  const claimed = new Set();
  let all = [];
  try { all = await fetchAllCalendarEvents(); } catch (e) { return claimed; }
  const dayKey = d => new Date(d.getTime() + 9 * 3600000).toISOString().slice(0, 10);
  vids.forEach(v => {
    const cands = all.filter(e => titleHasGuest(v.title, e.core));
    if (!cands.length) return;
    // ① 설명란에 촬영일이 적혀 있으면 그 날짜의 일정을 먼저 씁니다.
    const shot = shootDateFromDesc(v.desc, v.publishedAt);
    let best = null;
    // 촬영일이 있으면 그 날짜와 가장 가까운(±2일) 일정을 씁니다.
    if (shot) {
      let g = Infinity;
      cands.forEach(e => {
        const diff = Math.abs((shot - e.date) / 86400000);
        if (diff <= 2 && diff < g) { g = diff; best = e; }
      });
    }
    // ② 없으면 업로드 앞의 가장 가까운 일정으로 판단해요.
    if (!best) {
      let gap = Infinity;
      cands.forEach(e => {
        const d = (v.publishedAt - e.date) / 86400000;
        if (d < 0 || d > SET_WINDOW_DAYS) return;
        if (d < gap) { gap = d; best = e; }
      });
    }
    if (best && best.tag === '라이브') claimed.add(v.videoId);
  });
  return claimed;
}

// ---------------- 섹터(월) 단위 새로고침 ----------------

// 한 번의 갱신 작업 안에서는 캘린더를 재사용해요.
let _calCache = {};
function clearRefreshCache() { _calCache = {}; _liveCache = null; }
async function calendarCached(prefix = CALENDAR_PREFIX) {
  if (!_calCache[prefix]) _calCache[prefix] = await fetchCalendarGuestEvents(prefix);
  return _calCache[prefix];
}

// 특정 기간에 올라온 영상을 모아요.
// 주의: search.list는 결과가 약 500개로 제한돼 영상을 누락시키므로 쓰지 않습니다.
// 업로드 재생목록을 최신순으로 훑고, 필요한 기간보다 과거로 넘어가면 멈춰요.
async function fetchVideosInRange(channelId, afterISO, beforeISO) {
  const after = new Date(afterISO), before = new Date(beforeISO);
  const chData = await authFetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channelId}`);
  const ch = chData.items && chData.items[0];
  if (!ch) throw new Error('채널 정보를 읽지 못했어요.');
  const uploads = ch.contentDetails.relatedPlaylists.uploads;

  const items = [];
  let pt = '', pages = 0, reachedOlder = false;
  do {
    const qs = new URLSearchParams({ part: 'snippet,status', maxResults: '50', playlistId: uploads });
    if (pt) qs.set('pageToken', pt);
    const d = await authFetch(`https://www.googleapis.com/youtube/v3/playlistItems?${qs}`);
    const page = (d.items || []).map(i => ({
      videoId: i.snippet.resourceId.videoId,
      privacy: i.status && i.status.privacyStatus,
      title: nfc(i.snippet.title),
      desc: i.snippet.description || '',
      publishedAt: new Date(i.snippet.publishedAt)
    }));
    page.forEach(v => { if (v.publishedAt >= after && v.publishedAt <= before) items.push(v); });
    // 업로드 목록 순서가 완전한 날짜순이 아니라, 오래된 영상 하나만 섞여도 조기 종료되면 안 돼요.
    // 페이지 전체가 필요 기간보다 과거일 때만 멈춥니다.
    if (page.length && page.every(v => v.publishedAt < after)) reachedOlder = true;
    pt = d.nextPageToken || '';
    pages++;
  } while (pt && !reachedOlder && pages < 60);
  return items;
}

// 지금 보고 있는 섹터만 다시 수집해요.

  const btn = $('refresh-btn');

    render();
    $('sync-status').textContent = `완료 (${((Date.now() - t0) / 1000).toFixed(1)}초). "게시하기"를 눌러야 다른 사람에게도 반영돼요.`;

    btn.textContent = label;
    updateRefreshLabel();
  }
}

// 네모경제 코너의 한 달만 재수집
async function refreshNemoMonth(monthKeyStr) {
  const [y, mo] = monthKeyStr.split('-').map(Number);
  const monthStart = new Date(Date.UTC(y, mo - 1, 1, -9));
  const monthEnd = new Date(Date.UTC(y, mo, 1, -9));

  const all = await fetchVideosInRange(YOUTUBE_CHANNEL_ID, monthStart.toISOString(), monthEnd.toISOString());
  // 제목에 "네모경제"가 있고, 편 라벨이 없는 영상만 — 라벨이 있으면 직접 출연 회차라 본채널에서 이미 셌어요.
  const picked = all.filter(v => {
    const t = nfc(v.title);
    if (!t.includes(NEMO_KEYWORD)) return false;
    if (NEMO_PART_RE.test(t)) return false;
    return true;
  });

  const ids = picked.map(v => v.videoId);
  const [durs, views, an] = await Promise.all([
    fetchDurations(ids),
    fetchViewCounts(ids),
    fetchAnalyticsForVideos(ids)
  ]);

  // 쇼츠(3분 미만)는 코너 지표에서 빼요.
  const videos = picked.filter(v => !(typeof durs[v.videoId] === 'number' && durs[v.videoId] < 180)).map(v => {
    const d = durs[v.videoId];
    const a = an[v.videoId] || {};
    return {
      videoId: v.videoId,
      title: nfc(v.title),
      pub: v.publishedAt.toISOString().slice(0, 10),
      privacy: v.privacy,
      views: typeof views[v.videoId] === 'number' ? views[v.videoId] : null,
      durationSec: typeof d === 'number' ? d : null,
      isShort: typeof d === 'number' && d < 180,
      engagedViews: typeof a.engagedViews === 'number' ? a.engagedViews : null,
      avgViewDurationSec: typeof a.avgViewDurationSec === 'number' ? a.avgViewDurationSec : null,
      avgViewPct: typeof a.avgViewPct === 'number' ? a.avgViewPct : null
    };
  }).sort((x, y) => (x.pub < y.pub ? 1 : -1));

  const entry = {
    month: monthKeyStr,
    label: `${y}년 ${mo}월`,
    videos,
    updatedAt: new Date().toISOString()
  };
  publishedData.nemo = publishedData.nemo || { months: [] };
  publishedData.nemo.months = publishedData.nemo.months || [];
  const i = publishedData.nemo.months.findIndex(m => m.month === monthKeyStr);
  if (i >= 0) publishedData.nemo.months[i] = entry; else publishedData.nemo.months.push(entry);
  publishedData.nemo.months.sort((a, b) => (a.month < b.month ? -1 : 1));
  publishedData.updatedAt = new Date().toISOString();
}

// 본채널의 한 달만 재수집
async function refreshMainMonth(monthKeyStr) {
  const [y, mo] = monthKeyStr.split('-').map(Number);
  const monthStart = new Date(Date.UTC(y, mo - 1, 1, -9));
  const monthEnd = new Date(Date.UTC(y, mo, 1, -9));
  // 촬영일 + 14일까지 업로드분을 포함하려면 조회 범위를 넉넉히 잡아요.
  const searchAfter = monthStart;
  const searchBefore = new Date(monthEnd.getTime() + (SET_WINDOW_DAYS + 2) * 86400000);

  const allEvents = await calendarCached();
  const events = allEvents.filter(e => e.date >= monthStart && e.date < monthEnd);
  if (!events.length) throw new Error(`${monthKeyStr}에 "${CALENDAR_PREFIX}" 일정이 없어요.`);

  let vids = await fetchVideosInRange(YOUTUBE_CHANNEL_ID, searchAfter.toISOString(), searchBefore.toISOString());
  // 비공개 영상 보강 (업로드 목록에는 비공개가 빠져 있어요)
  const extra = await fetchNonPublicUploads(vids, searchAfter);
  vids = vids.concat(extra.filter(v => v.publishedAt <= searchBefore));
  // [라이브] 일정이 만든 영상은 게스트 세트에서 빼요.
  const liveIds = await liveClaimedIds(vids);
  vids = vids.filter(v => !liveIds.has(v.videoId));

  const used = new Set();
  const sets = events.map(ev => {
    const start = ev.date;
    const end = new Date(start.getTime() + SET_WINDOW_DAYS * 86400000);
    end.setHours(23, 59, 59, 999);
    // 설명란에 촬영일이 적혀 있으면 그 날짜와 일치하는 영상만 이 회차로 봐요.
    // (기입이 없는 영상은 기존처럼 업로드 기간으로 판단합니다.)
    // 같은 게스트의 다른 촬영 일정 날짜들
    const otherDates = events.filter(e => e !== ev && sameGuest(guestKey(e.name), guestKey(ev.name)))
      .map(e => e.date);
    const cand = vids
      .filter(v => {
        if (used.has(v.videoId)) return false;
        if (!titleHasGuest(v.title, ev.core)) return false;
        if (v.title.includes(EXCLUDE_KEYWORD)) return false;
        const shot = shootDateFromDesc(v.desc, v.publishedAt);
        // 촬영일이 같은 게스트의 다른 회차를 가리키면 제외해요 (회차 섞임 방지).
        if (shootConflicts(shot, start, otherDates)) return false;
        return v.publishedAt >= start && v.publishedAt <= end;
      })
      .sort((a, b) => a.publishedAt - b.publishedAt);
    const picked = [], parts = new Set();
    cand.forEach(v => {
      const m = v.title.match(/([1-5])부/);
      const key = m ? m[1] : (v.title.includes('풀버전') ? 'full' : null);
      if (key && !parts.has(key)) {
        parts.add(key);
        picked.push({ videoId: v.videoId, title: v.title, privacy: v.privacy, part: key === 'full' ? '풀버전' : key + '부', pub: v.publishedAt.toISOString().slice(0, 10) });
      }
    });
    const numParts = [...parts].filter(k => k !== 'full').length;
    // 1부가 올라온 순간부터 바로 반영해요. 세트가 다 차기 전까지는 '업로드 중'으로 표시합니다.
    const complete = parts.has('full') && numParts >= MIN_PARTS;
    const ok = picked.length > 0;
    if (ok) picked.forEach(p => used.add(p.videoId));
    return { ...ev, picked, hasFull: parts.has('full'), numParts, complete, ok };
  });

  const ids = [...new Set(sets.filter(s => s.ok).flatMap(s => s.picked.map(p => p.videoId)))];
  const [viewCounts, analytics] = await Promise.all([
    fetchViewCounts(ids), fetchAnalyticsForVideos(ids)
  ]);

  // 시청 지표를 못 받았을 때 예전 값을 잃지 않도록, 직전에 저장해둔 값을 찾아둬요.
  const prevMonthEntry = (publishedData.months || []).find(m => m.month === monthKeyStr);
  const prevVals = {};
  ((prevMonthEntry || {}).guests || []).forEach(g => (g.videos || []).forEach(v => {
    prevVals[`${g.name}|${g.eventDate}|${v.part}`] = v;
  }));

  const guests = [], pending = [];
  sets.forEach(s => {
    if (!s.ok) {
      pending.push({
        name: s.name, eventDate: s.date.toISOString().slice(0, 10), uploaded: s.picked.length,
        note: (s.hasFull && s.numParts === 2) ? '라이브 편집본만 업로드됨'
            : (s.picked.length ? `일부만 업로드됨 (${s.picked.length}편)` : '미업로드')
      });
      return;
    }
    const videos = s.picked.map(p => {
      const a = analytics[p.videoId] || {};
      const old = prevVals[`${s.name}|${s.date.toISOString().slice(0, 10)}|${p.part}`] || {};
      // 이번에 못 받은 지표는 예전 값을 그대로 둡니다 (빈 값으로 덮어쓰지 않아요).
      const keep = (now, before) => (typeof now === 'number' ? now : (typeof before === 'number' ? before : null));
      return {
        part: p.part, pub: p.pub, title: p.title || null, privacy: p.privacy || null,
        views: viewCounts[p.videoId] ?? old.views ?? null,
        engagedViews: keep(a.engagedViews, old.engagedViews),
        avgViewDurationSec: keep(a.avgViewDurationSec, old.avgViewDurationSec),
        avgViewPct: keep(a.avgViewPct, old.avgViewPct)
      };
    }).sort((a, b) => partOrder(a.part) - partOrder(b.part));
    const n = videos.length || 1;
    const avg = k => { const q = videos.map(v => v[k]).filter(x => typeof x === 'number'); return q.length ? q.reduce((a, b) => a + b, 0) / q.length : null; };
    // 집계는 지금까지처럼 일반 조회수 기준이에요. 유효 조회수는 참고용으로 따로 보여주기만 합니다.
    const totalViews = videos.reduce((x, v) => x + (v.views || 0), 0);
    // 모든 편의 유효 조회수를 받았을 때만 합계를 내요 (일부만 더하면 오해를 부릅니다).
    const engVals = videos.map(v => v.engagedViews).filter(x => typeof x === 'number');
    const totalEngagedViews = engVals.length === videos.length && engVals.length
      ? engVals.reduce((a, b) => a + b, 0) : null;
    const ad = avg('avgViewDurationSec'), ap = avg('avgViewPct');
    guests.push({
      name: s.name, eventDate: s.date.toISOString().slice(0, 10), category: s.category || null, videoCount: n,
      complete: s.complete, hasFull: s.hasFull, numParts: s.numParts,
      totalViews, totalEngagedViews, avgViews: Math.round(totalViews / n),
      avgViewDurationSec: ad == null ? null : Math.round(ad),
      avgViewPct: ap == null ? null : +ap.toFixed(2),
      videos
    });
  });
  guests.sort((a, b) => a.eventDate.localeCompare(b.eventDate));
  pending.sort((a, b) => a.eventDate.localeCompare(b.eventDate));

  const label = `${y}년 ${mo}월`;
  publishedData.months = publishedData.months || [];
  const idx = publishedData.months.findIndex(m => m.month === monthKeyStr);
  const entry = { month: monthKeyStr, label, guests, pending, updatedAt: new Date().toISOString() };
  if (idx >= 0) publishedData.months[idx] = entry; else publishedData.months.push(entry);
  // 게스트도 예정도 없는 달만 탭에서 빼요 (촬영 예정만 있는 달은 남겨서 미리 볼 수 있게).
  publishedData.months = publishedData.months.filter(m => (m.guests || []).length || (m.pending || []).length);
  publishedData.months.sort((a, b) => a.month.localeCompare(b.month));
  publishedData.updatedAt = new Date().toISOString();
}

// 팀원(담당자) 한 명의 한 달치 평균을 계산해요. 세부 영상 목록은 저장하지 않습니다.
async function refreshTeamMonth(tag, monthKeyStr) {
  const [y, mo] = monthKeyStr.split('-').map(Number);
  const monthStart = new Date(Date.UTC(y, mo - 1, 1, -9));
  const monthEnd = new Date(Date.UTC(y, mo, 1, -9));
  const searchBefore = new Date(monthEnd.getTime() + (SET_WINDOW_DAYS + 2) * 86400000);

  const events = (await calendarCached('[' + tag + ']'))
    .filter(e => e.date >= monthStart && e.date < monthEnd)
    .filter(e => !TEAM_EXCLUDE_EVENT.test(e.name));

  const vids = await fetchVideosInRange(YOUTUBE_CHANNEL_ID, monthStart.toISOString(), searchBefore.toISOString());

  // 팀원 집계 기준 (본채널과 동일):
  //  - 편 라벨(1~5부)·풀버전이 붙은 본편만 셈 → 쇼츠·재업로드 제외
  //  - 특집(합동 출연)은 담당자 간 중복 계산을 피하려고 제외
  //  - 풀버전 + 3편 이상이 모두 올라온 세트만 집계 (업로드 진행 중인 게스트는 빠짐)
  const used = new Set();
  const sets = [];
  events.forEach(ev => {
    const start = ev.date;
    const end = new Date(start.getTime() + SET_WINDOW_DAYS * 86400000);
    end.setHours(23, 59, 59, 999);
    const cand = vids.filter(v => !used.has(v.videoId) && titleHasGuest(v.title, ev.core)
      && !v.title.includes(EXCLUDE_KEYWORD)
      && (/\d+\s*부/.test(v.title) || v.title.includes('풀버전'))
      && v.publishedAt >= start && v.publishedAt <= end)
      .sort((a, b) => a.publishedAt - b.publishedAt);
    const parts = new Set(), picked = [];
    cand.forEach(v => {
      const m = v.title.match(/([1-5])부/);
      const key = m ? m[1] : (v.title.includes('풀버전') ? 'full' : null);
      if (key && !parts.has(key)) { parts.add(key); picked.push(v.videoId); }
    });
    const numParts = [...parts].filter(k => k !== 'full').length;
    if (parts.has('full') && numParts >= MIN_PARTS) {
      picked.forEach(id => used.add(id));
      sets.push({ name: ev.name, ids: picked });
    }
  });

  const allIds = sets.flatMap(s => s.ids);
  const views = await fetchViewCounts(allIds);
  const totalViews = allIds.reduce((a, id) => a + (views[id] || 0), 0);
  const guestCount = sets.length;
  const videoCount = allIds.length;

  const entry = {
    month: monthKeyStr, label: `${y}년 ${mo}월`,
    guestCount, videoCount, totalViews,
    avgViewsPerGuest: guestCount ? Math.round(totalViews / guestCount) : null,
    avgViewsPerVideo: videoCount ? Math.round(totalViews / videoCount) : null,
    scheduled: events.length,
    updatedAt: new Date().toISOString()
  };

  publishedData.team = publishedData.team || { members: [] };
  let mem = publishedData.team.members.find(m => m.key === tag);
  if (!mem) { mem = { key: tag, months: [] }; publishedData.team.members.push(mem); }
  const i = mem.months.findIndex(m => m.month === monthKeyStr);
  if (i >= 0) mem.months[i] = entry; else mem.months.push(entry);
  mem.months.sort((a, b) => a.month.localeCompare(b.month));
  publishedData.team.members.sort((a, b) => TEAM_MEMBERS.indexOf(a.key) - TEAM_MEMBERS.indexOf(b.key));
  publishedData.updatedAt = new Date().toISOString();
}

// 저장소 한 채널의 한 달만 재수집
async function refreshArchiveMonth(channelKey, monthKeyStr) {
  const entry = ARCHIVE_CHANNELS.find(c => c.key === channelKey);
  if (!entry) throw new Error('알 수 없는 저장소 카테고리예요.');
  const [y, mo] = monthKeyStr.split('-').map(Number);
  const start = new Date(Date.UTC(y, mo - 1, 1, -9));
  const end = new Date(Date.UTC(y, mo, 1, -9));

  const vids = await fetchVideosInRange(entry.channelId, start.toISOString(), end.toISOString());
  let items = vids.map(v => ({ ...v, g: archiveGroupOf(v.title) })).filter(v => v.g);
  // 쇼츠(3분 미만)는 조회수 계산에서 빼요.
  const durs = await fetchDurations(items.map(v => v.videoId));
  items = items.filter(v => {
    const d = durs[v.videoId];
    return typeof d !== 'number' || d >= 180;
  });
  const ids = items.map(v => v.videoId);
  const [views, an] = await Promise.all([
    fetchViewCounts(ids), fetchArchiveAnalytics(entry.channelId, ids)
  ]);

  const rows = items.map(v => ({ g: v.g, views: views[v.videoId] ?? null, dur: (an[v.videoId] || {}).dur ?? null }));
  const avg = (arr, k) => { const q = arr.map(x => x[k]).filter(x => typeof x === 'number'); return q.length ? q.reduce((a, b) => a + b, 0) / q.length : null; };
  const groups = {};
  ARCHIVE_GROUPS.forEach(g => {
    const arr = rows.filter(x => x.g === g);
    if (!arr.length) return;
    const vv = avg(arr, 'views'), dd = avg(arr, 'dur');
    groups[g] = {
      videoCount: arr.length,
      avgViews: vv == null ? null : Math.round(vv),
      avgViewDurationSec: dd == null ? null : Math.round(dd)
    };
  });
  const vv = avg(rows, 'views'), dd = avg(rows, 'dur');
  const monthEntry = {
    month: monthKeyStr, label: `${y}년 ${mo}월`, videoCount: rows.length,
    avgViews: vv == null ? null : Math.round(vv),
    avgViewDurationSec: dd == null ? null : Math.round(dd),
    groups, updatedAt: new Date().toISOString()
  };

  // 채널 구독자 수도 함께 가져와요.
  let subs = null;
  try {
    const st = await authFetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${entry.channelId}`);
    const item = st.items && st.items[0];
    if (item && item.statistics) {
      subs = item.statistics.hiddenSubscriberCount ? null : Number(item.statistics.subscriberCount);
    }
  } catch (e) { console.warn('구독자 수 조회 실패:', e.message); }

  publishedData.archive = publishedData.archive || { channels: [] };
  let ch = publishedData.archive.channels.find(c => c.key === channelKey);
  if (!ch) {
    ch = { key: entry.key, name: entry.name, channelId: entry.channelId, months: [] };
    publishedData.archive.channels.push(ch);
  }
  if (subs !== null) { ch.subscribers = subs; ch.subsAt = new Date().toISOString(); }
  const i = ch.months.findIndex(m => m.month === monthKeyStr);
  if (i >= 0) ch.months[i] = monthEntry; else ch.months.push(monthEntry);
  ch.months.sort((a, b) => a.month.localeCompare(b.month));
  publishedData.updatedAt = new Date().toISOString();
}

// ---------------- 저장소 채널 수집 ----------------

// 채널 이름으로 채널 ID를 찾아요 (내 계정의 채널이므로 검색으로 찾습니다).
async function resolveArchiveChannelId(name) {
  const qs = new URLSearchParams({ part: 'snippet', type: 'channel', q: name, maxResults: '10' });
  const d = await authFetch(`https://www.googleapis.com/youtube/v3/search?${qs}`);
  const exact = (d.items || []).find(i => i.snippet.title.trim() === name);
  const loose = (d.items || []).find(i => i.snippet.title.includes(name.split('_').pop()));
  const hit = exact || loose;
  return hit ? (hit.snippet.channelId || hit.id.channelId) : null;
}

// 제목으로 유형을 구분해요: "통합본"이 들어가면 통합본, 1~N부만 있으면 라이브.
function archiveGroupOf(title) {
  if (title.includes('통합본')) return '통합본';
  if (/\d+\s*부/.test(title)) return '라이브';
  return null;   // 그 외(쇼츠·예고 등)는 집계에서 제외
}

async function collectArchiveChannel(entry) {
  const channelId = entry.channelId || await resolveArchiveChannelId(entry.name);
  if (!channelId) return { key: entry.key, name: entry.name, channelId: null, months: [], error: '채널을 찾지 못했어요' };

  const chData = await authFetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channelId}`);
  const ch = chData.items && chData.items[0];
  if (!ch) return { key: entry.key, name: entry.name, channelId, months: [], error: '채널 정보를 못 읽었어요' };
  const uploads = ch.contentDetails.relatedPlaylists.uploads;

  // 업로드 전체 수집 (최대 1000개)
  let vids = [], pt = '', pages = 0;
  do {
    const qs = new URLSearchParams({ part: 'snippet', maxResults: '50', playlistId: uploads });
    if (pt) qs.set('pageToken', pt);
    const d = await authFetch(`https://www.googleapis.com/youtube/v3/playlistItems?${qs}`);
    (d.items || []).forEach(i => vids.push({
      videoId: i.snippet.resourceId.videoId,
      title: nfc(i.snippet.title),
      publishedAt: new Date(i.snippet.publishedAt)
    }));
    pt = d.nextPageToken || '';
    pages++;
  } while (pt && pages < 20);

  const ids = vids.map(v => v.videoId);
  const views = await fetchViewCounts(ids);
  const an = await fetchArchiveAnalytics(channelId, ids);

  // 월별 · 유형별 집계
  const byMonth = new Map();
  vids.forEach(v => {
    const group = archiveGroupOf(v.title);
    if (!group) return;
    const key = monthKey(v.publishedAt);
    if (!byMonth.has(key)) byMonth.set(key, { month: key, label: monthLabel(v.publishedAt), items: [] });
    byMonth.get(key).items.push({
      group,
      views: views[v.videoId] ?? null,
      dur: (an[v.videoId] || {}).dur ?? null
    });
  });

  const avg = (arr, k) => {
    const q = arr.map(x => x[k]).filter(x => typeof x === 'number');
    return q.length ? q.reduce((a, b) => a + b, 0) / q.length : null;
  };
  const months = [...byMonth.values()].map(m => {
    const groups = {};
    ARCHIVE_GROUPS.forEach(g => {
      const arr = m.items.filter(x => x.group === g);
      if (!arr.length) return;
      const d = avg(arr, 'dur'), vv = avg(arr, 'views');
      groups[g] = {
        videoCount: arr.length,
        avgViews: vv == null ? null : Math.round(vv),
        avgViewDurationSec: d == null ? null : Math.round(d)
      };
    });
    const d = avg(m.items, 'dur'), vv = avg(m.items, 'views');
    return {
      month: m.month, label: m.label, videoCount: m.items.length,
      avgViews: vv == null ? null : Math.round(vv),
      avgViewDurationSec: d == null ? null : Math.round(d),
      groups
    };
  }).sort((a, b) => a.month.localeCompare(b.month));

  return { key: entry.key, name: entry.name, channelId, months };
}

// 저장소 채널의 시청 지속시간 (채널별로 ids 파라미터가 달라요)
async function fetchArchiveAnalytics(channelId, videoIds) {
  const result = {};
  for (let i = 0; i < videoIds.length; i += 50) {
    const batch = videoIds.slice(i, i + 50);
    const qs = new URLSearchParams({
      ids: `channel==${channelId}`,
      startDate: '2005-01-01',
      endDate: new Date().toISOString().slice(0, 10),
      metrics: 'averageViewDuration',
      dimensions: 'video',
      filters: `video==${batch.join(',')}`,
      maxResults: '200'
    });
    try {
      const d = await authFetch(`https://youtubeanalytics.googleapis.com/v2/reports?${qs}`);
      (d.rows || []).forEach(r => { result[r[0]] = { dur: r[1] }; });
    } catch (err) {
      console.warn('저장소 시청 지표를 못 가져왔어요:', err.message);
      break;
    }
  }
  return result;
}



// ---------------- 관리자: GitHub에 게시 ----------------

async function publishToGithub() {
  if (!publishedData) return;
  // 브라우저에만 있던 기록(작업 로직·재출연 불가)도 함께 올려요.
  publishedData.workLogic = loadLogic();
  publishedData.blocked = [...loadBlocked()];
  let pat = localStorage.getItem('gh_pat');
  if (!pat) {
    pat = prompt('GitHub Personal Access Token을 입력하세요 (repo 쓰기 권한 필요, 이 브라우저에만 저장돼요):');
    if (!pat) return;
    localStorage.setItem('gh_pat', pat);
  }
  $('sync-status').hidden = false;
  $('sync-status').textContent = 'GitHub에 게시하는 중...';
  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;
    let sha = undefined;
    const getRes = await fetch(apiUrl, { headers: { Authorization: `Bearer ${pat}` } });
    if (getRes.ok) {
      const getData = await getRes.json();
      sha = getData.sha;
    } else if (getRes.status !== 404) {
      throw new Error(`파일 조회 실패: ${getRes.status}`);
    }
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(publishedData, null, 2))));
    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${pat}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: '대시보드 데이터 업데이트', content, sha, branch: 'main' })
    });
    if (!putRes.ok) {
      const body = await putRes.text().catch(() => '');
      if (putRes.status === 401) { localStorage.removeItem('gh_pat'); }
      throw new Error(`게시 실패: ${putRes.status} ${body}`);
    }
    const when = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    $('sync-status').textContent = `게시 완료 (${when}) — 몇 분 안에 모두에게 반영돼요.`;
    showToast(`✓ 게시 완료 — ${when}. 다른 기기에도 반영됩니다.`, true);
  } catch (err) {
    console.error(err);
    $('sync-status').textContent = '게시 중 오류: ' + err.message;
    showToast('게시 실패 — ' + err.message.slice(0, 80), false);
  }
}

$('publish-btn').addEventListener('click', publishToGithub);
</script>
</body>
</html>
